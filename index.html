<script>
async function fetchMopRates(){try{const {rates,previous}=await getYahooFx();write(STORE.fx,{rates,savedAt:Date.now(),source:'Yahoo Finance'});write(STORE.prev,{rates:previous,savedAt:Date.now(),source:'Yahoo Finance previous close'});renderFx(rates,previous)}catch{const current=read(STORE.fx),baseline=read(STORE.prev);renderFx(current?.rates||Object.fromEntries(MARKETS.map(m=>[m.code,m.fallbackMop])),baseline?.rates||{})}}
</script>
