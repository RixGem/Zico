<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Global Markets TV Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{overflow:hidden;background:#000;color:white;font-family:Arial,Helvetica,sans-serif;width:100vw;height:100vh}#ticker-container{position:fixed;top:0;left:20vw;width:80vw;height:50vh;z-index:1;animation:tickerFade 3s ease-in-out infinite}.tradingview-widget-container{width:100%;height:100%;transform:scale(1.8);transform-origin:top left;animation:pulseGlow 4s ease-in-out infinite;filter:drop-shadow(0 0 12px rgba(0,180,255,.35))}.tradingview-widget-container__widget{animation:marketPulse 1.8s ease-in-out infinite}#clock-container{position:fixed;top:55%;left:20vw;width:80vw;height:12vh;overflow:hidden;background:#001f3f;border-block:2px solid white;z-index:2}#clock-ticker,#mop-ticker,#weather-ticker{display:inline-block;white-space:nowrap;padding-left:100%}#clock-ticker{animation:scroll-clocks 55s linear infinite}.clock{display:inline-block;margin-right:60px;padding:18px 25px;font-size:34px;font-weight:bold}#mop-container{position:fixed;top:67%;left:20vw;width:80vw;height:11vh;overflow:hidden;background:#001a10;border-block:2px solid #00cc66;z-index:3}#mop-ticker{animation:scroll-mop 50s linear infinite}.mop-rate{display:inline-block;margin-right:70px;padding:14px 22px;font-size:24px;font-weight:bold}.mop-label{color:#00cc66;margin-right:8px}.mop-value{color:white}.mop-flag{margin-right:6px;font-size:26px}#weather-container{position:fixed;top:78%;left:20vw;width:80vw;height:11vh;overflow:hidden;background:#002b55;border-block:2px solid white;z-index:4}#weather-ticker{animation:scroll-weather 70s linear infinite}.weather{display:inline-block;margin-right:80px;padding:18px 25px;font-size:26px;font-weight:600;opacity:.9;letter-spacing:1px}#stories-container{position:fixed;top:0;left:0;width:20vw;height:100vh;overflow:hidden;background:#001f3f;border-right:2px solid white;z-index:5}.sidebar-head{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #ffffff55;background:#001f3f}.sidebar-title{font-size:14px}.sidebar-sub,.wire-meta{font-size:11px;color:#94a3b8}.sidebar-heading{display:flex;flex-direction:column;gap:3px}.sidebar-tools{display:flex;align-items:center;gap:7px}.live-tag{color:#12b886;font-size:11px}.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#12b886;animation:livePulse 2s infinite}.view-tabs{display:flex;gap:2px}.view-tab,.wire-toggle{border:1px solid #33465d;background:#00152b;color:white;padding:4px 6px;font-size:10px;cursor:pointer}.view-tab[aria-selected=true]{background:#17304a;color:#12b886}.stories-frame{height:calc(100% - 72px);overflow:hidden;position:relative}.wire-viewport{height:100%;overflow:hidden}.wire-track{animation:wireScroll 110s linear infinite}.wire-list{list-style:none}.wire-item{border-bottom:1px solid #ffffff20}.wire-link{display:block;padding:11px 12px;color:white;text-decoration:none}.wire-link:hover{background:#ffffff10}.wire-meta{display:flex;justify-content:space-between;margin-bottom:5px}.wire-source{color:#93c5fd}.wire-headline{font-size:13px;line-height:1.35}.tv-viewport{height:100%;overflow:hidden;position:relative}.tv-marquee{position:absolute;top:0;left:0;width:121.95%;height:200%;transform-origin:top left;animation:tvScroll 55s linear infinite}.tv-marquee .tradingview-widget-container,.tv-marquee .tradingview-widget-container__widget{width:100%;height:100%}.stories-frame[data-view=tv] .tv-viewport:hover .tv-marquee,.stories-frame[data-view=tv] .tv-viewport:focus-within .tv-marquee{animation-play-state:paused}#stories-container.is-paused .wire-track,#stories-container.is-paused .tv-marquee{animation-play-state:paused}.wire-status{padding:16px;color:#94a3b8;font-size:12px}@keyframes scroll-clocks{to{transform:translateX(-100%)}}@keyframes scroll-mop{to{transform:translateX(-100%)}}@keyframes scroll-weather{to{transform:translateX(-100%)}}@keyframes wireScroll{to{transform:translateY(-50%)}}@keyframes tvScroll{from{transform:translateY(100%) scale(.82)}to{transform:translateY(-100%) scale(.82)}}@keyframes pulseGlow{50%{filter:drop-shadow(0 0 18px rgba(0,180,255,.55))}}@keyframes tickerFade{50%{opacity:1}}@keyframes marketPulse{50%{transform:translateY(-2px)}}@keyframes livePulse{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){.wire-track,.tv-marquee,#clock-ticker,#mop-ticker,#weather-ticker{animation:none!important}.wire-viewport,.tv-viewport{overflow:auto}.live-dot{animation:none}}
</style>
</head><body>
<div id="ticker-container"><div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div><script src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>{"symbols":[{"proName":"FOREXCOM:SPXUSD","title":"S&P 500"},{"proName":"FOREXCOM:NSXUSD","title":"NASDAQ 100"},{"proName":"BITSTAMP:BTCUSD","title":"Bitcoin"},{"proName":"BITSTAMP:ETHUSD","title":"Ethereum"},{"proName":"NYSE:GS","title":"Goldman Sachs"},{"proName":"NYSE:JPM","title":"JPMorgan"},{"proName":"NASDAQ:AVGO","title":"Broadcom"},{"proName":"NYSE:V","title":"Visa"},{"proName":"NYSE:BA","title":"Boeing"},{"proName":"NYSE:MCD","title":"McDonald's"},{"proName":"NASDAQ:CSCO","title":"Cisco"},{"proName":"NYSE:HSBC","title":"HSBC"},{"proName":"OANDA:XAUUSD","title":"Gold"},{"proName":"OANDA:XAGUSD","title":"Silver"},{"proName":"FX_IDC:EURUSD","title":"EUR/USD"},{"proName":"OANDA:USDCAD","title":"USD/CAD"}],"showSymbolLogo":true,"isTransparent":false,"displayMode":"compact","colorTheme":"dark","locale":"en"}</script></div></div>
<div id="clock-container"><div id="clock-ticker"><span class="clock" id="new-york"></span><span class="clock" id="london"></span><span class="clock" id="tokyo"></span><span class="clock" id="sydney"></span><span class="clock" id="macau"></span></div></div>
<div id="mop-container"><div id="mop-ticker"><span class="mop-rate"><span class="mop-flag">🇺🇸</span><span class="mop-label">1 USD =</span><span class="mop-value">8.07 MOP</span></span><span class="mop-rate"><span class="mop-flag">🇪🇺</span><span class="mop-label">1 EUR =</span><span class="mop-value">9.36 MOP</span></span><span class="mop-rate"><span class="mop-flag">🇬🇧</span><span class="mop-label">1 GBP =</span><span class="mop-value">10.92 MOP</span></span><span class="mop-rate"><span class="mop-flag">🇨🇭</span><span class="mop-label">1 CHF =</span><span class="mop-value">10.38 MOP</span></span><span class="mop-rate"><span class="mop-flag">🇭🇰</span><span class="mop-label">1 HKD =</span><span class="mop-value">1.03 MOP</span></span><span class="mop-rate"><span class="mop-flag">🇯🇵</span><span class="mop-label">100 JPY =</span><span class="mop-value">5.17 MOP</span></span></div></div>
<div id="weather-container"><div id="weather-ticker"><span class="weather" id="weather-ny"></span><span class="weather" id="weather-lon"></span><span class="weather" id="weather-tok"></span><span class="weather" id="weather-syd"></span><span class="weather" id="weather-mac"></span></div></div>
<aside id="stories-container"><header class="sidebar-head"><div class="sidebar-heading"><h2 class="sidebar-title">TOP STORIES</h2><span class="sidebar-sub">MARKET WIRE</span></div><nav class="view-tabs" role="tablist" aria-label="News view"><button class="view-tab" id="tab-wire" role="tab" aria-selected="true">Wire</button><button class="view-tab" id="tab-tv" role="tab" aria-selected="false">TradingView</button></nav><div class="sidebar-tools"><span class="live-tag"><span class="live-dot"></span> LIVE</span><button id="wire-toggle" class="wire-toggle" aria-pressed="false">Pause</button></div></header><div class="stories-frame" id="wire-frame" data-view="wire"><p class="wire-status">Loading headlines…</p></div></aside>
<script>
(()=>{'use strict';const feeds=[['Reuters','https://www.reuters.com/world/'],['CNBC','https://www.cnbc.com/id/100003114/device/rss/rss.html'],['MarketWatch','https://feeds.marketwatch.com/marketwatch/topstories/'],['Yahoo Finance','https://finance.yahoo.com/news/rssindex']],proxy='https://api.rss2json.com/v1/api.json?rss_url=',frame=document.getElementById('wire-frame'),panel=document.getElementById('stories-container');let active='wire',tvMounted=false;const safe=u=>{try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:null}catch{return null}},age=t=>{const m=Math.max(0,Math.round((Date.now()-t)/60000));return m<1?'Just now':m<60?m+'m ago':Math.round(m/60)+'h ago'};async function getStories(){const results=await Promise.allSettled(feeds.map(async([source,url])=>{const c=new AbortController(),timer=setTimeout(()=>c.abort(),9000);try{const r=await fetch(proxy+encodeURIComponent(url),{signal:c.signal});if(!r.ok)throw Error();const j=await r.json();if(j.status!=='ok')throw Error();return j.items.map(x=>({source,title:String(x.title||'').replace(/<[^>]*>/g,'').trim(),link:safe(x.link),time:Date.parse(x.pubDate)}))}finally{clearTimeout(timer)}}));const seen=new Set(),items=[];for(const r of results)if(r.status==='fulfilled')for(const x of r.value){const k=x.title.toLowerCase();if(x.title&&x.link&&!seen.has(k)){seen.add(k);items.push(x)}}return items.sort((a,b)=>(b.time||0)-(a.time||0)).slice(0,24)}function makeList(items,clone){const ul=document.createElement('ul');ul.className='wire-list';if(clone)ul.setAttribute('aria-hidden','true');for(const x of items){const li=document.createElement('li'),a=document.createElement('a'),meta=document.createElement('span'),src=document.createElement('span'),time=document.createElement('time'),title=document.createElement('span');li.className='wire-item';a.className='wire-link';a.href=x.link;a.target='_blank';a.rel='noopener noreferrer';if(clone)a.tabIndex=-1;meta.className='wire-meta';src.className='wire-source';src.textContent=x.source;time.textContent=Number.isFinite(x.time)?age(x.time):'';time.dataset.time=Number.isFinite(x.time)?x.time:'';meta.append(src,time);title.className='wire-headline';title.textContent=x.title;a.append(meta,title);li.append(a);ul.append(li)}return ul}function render(items){if(active!=='wire')return;const track=document.createElement('div');track.className='wire-track';track.append(makeList(items,false),makeList(items,true));frame.replaceChildren(track)}function cacheItems(){try{return JSON.parse(localStorage.getItem('zico_market_wire_v1')||'[]')}catch{return []}}async function refresh(){try{const items=await getStories();if(items.length>=3){try{localStorage.setItem('zico_market_wire_v1',JSON.stringify(items))}catch{}render(items);return}}catch{}const cached=cacheItems();if(cached.length)render(cached);else if(active==='wire')frame.innerHTML='<p class="wire-status">Headlines temporarily unavailable.</p>'}function mountTv(){if(tvMounted)return;tvMounted=true;const viewport=document.createElement('div'),outer=document.createElement('div'),container=document.createElement('div'),target=document.createElement('div'),script=document.createElement('script');viewport.className='tv-viewport';outer.className='tv-marquee';container.className='tradingview-widget-container';target.className='tradingview-widget-container__widget';script.async=true;script.src='https://s3.tradingview.com/external-embedding/embed-widget-timeline.js';script.textContent=JSON.stringify({feedMode:'all_symbols',displayMode:'regular',isTransparent:true,colorTheme:'dark',locale:'en',width:'100%',height:'100%'});container.append(target,script);outer.append(container);viewport.append(outer);frame.replaceChildren(viewport)}function switchView(v){active=v;frame.dataset.view=v;document.getElementById('tab-wire').setAttribute('aria-selected',String(v==='wire'));document.getElementById('tab-tv').setAttribute('aria-selected',String(v==='tv'));try{localStorage.setItem('zico_news_view',v)}catch{}if(v==='tv')mountTv();else{tvMounted=false;const cached=cacheItems();if(cached.length)render(cached);refresh()}}document.getElementById('tab-wire').onclick=()=>switchView('wire');document.getElementById('tab-tv').onclick=()=>switchView('tv');document.getElementById('wire-toggle').onclick=e=>{const paused=!panel.classList.contains('is-paused');panel.classList.toggle('is-paused',paused);e.currentTarget.textContent=paused?'Play':'Pause';e.currentTarget.setAttribute('aria-pressed',String(paused))};let saved='wire';try{saved=localStorage.getItem('zico_news_view')||'wire'}catch{}switchView(saved==='tv'?'tv':'wire');setInterval(()=>{if(active==='wire')refresh()},300000);setInterval(()=>document.querySelectorAll('.wire-meta time[data-time]').forEach(t=>{if(t.dataset.time)t.textContent=age(+t.dataset.time)}),60000);
const zones=[['new-york','America/New_York','🗽 NEW YORK'],['london','Europe/London','🎡 LONDON'],['tokyo','Asia/Tokyo','🗼 TOKYO'],['sydney','Australia/Sydney','🦘 SYDNEY'],['macau','Asia/Macau','🎰 MACAU']];function updateClocks(){for(const[id,zone,label]of zones){const el=document.getElementById(id);if(el)el.textContent=label+': '+new Date().toLocaleTimeString('en-US',{timeZone:zone,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true})}}updateClocks();setInterval(updateClocks,1000);const weather=[['weather-ny','☀️ NEW YORK 24°C CLEAR'],['weather-lon','🌧️ LONDON 18°C RAIN'],['weather-tok','☁️ TOKYO 27°C CLOUDS'],['weather-syd','☀️ SYDNEY 21°C SUNNY'],['weather-mac','🌤️ MACAU 29°C PARTLY CLOUDY']];for(const[id,text]of weather){const el=document.getElementById(id);if(el)el.textContent=text}
})();
</script>
