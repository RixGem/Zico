<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zico — Global Markets TV Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg-abyss: #060B12;
    --bg-panel: #0B1320;
    --bg-header: #09111D;
    --bg-clock: #081629;
    --bg-fx: #061813;
    --bg-weather: #091C32;
    --rule: #1C2B40;
    --rule-fx: #14533D;
    --text-primary: #F1F5F9;
    --text-secondary: #94A3B8;
    --up-jade: #12B886;
    --down-coral: #F05252;
    --amber-live: #F59F00;
    --font-ui: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: var(--bg-abyss);
    color: var(--text-primary);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
}

.tabular {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
}

/* =========================================
   APP GRID (20vw SIDEBAR | 80vw STAGE)
   ========================================= */

#dashboard {
    display: grid;
    grid-template-columns: 20vw 80vw;
    width: 100vw;
    height: 100vh;
    background: var(--rule);
    gap: 1px;
}

/* =========================================
   LEFT SIDEBAR: MARKET WIRE
   ========================================= */

#stories-sidebar {
    display: grid;
    grid-template-rows: 72px 1fr;
    background: var(--bg-panel);
    min-width: 0;
    min-height: 0;
    overflow: hidden;
}

.sidebar-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    background: var(--bg-header);
    border-bottom: 1px solid var(--rule);
}

.sidebar-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--text-primary);
}

.live-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--up-jade);
}

.live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--up-jade);
    box-shadow: 0 0 8px rgba(18, 184, 134, 0.7);
    animation: livePulse 2.2s ease-in-out infinite;
}

.live-dot.amber {
    background: var(--amber-live);
    box-shadow: 0 0 8px rgba(245, 159, 0, 0.7);
}

.stories-frame {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 0;
    overflow: hidden;
    background: var(--bg-panel);
}

.stories-frame .tradingview-widget-container,
.stories-frame .tradingview-widget-container__widget {
    width: 100%;
    height: 100%;
}

/* =========================================
   RIGHT BROADCAST STACK (80vw x 100vh)
   ========================================= */

#main-stack {
    display: grid;
    grid-template-rows: 72px 42px 1fr 8.2vh 9.0vh 8.2vh;
    min-width: 0;
    min-height: 0;
    background: var(--rule);
    gap: 1px;
}

/* =========================================
   ROW 1: GLOBAL TICKER TAPE
   ========================================= */

#ticker-band {
    background: var(--bg-header);
    overflow: hidden;
    min-width: 0;
    min-height: 0;
}

#ticker-band .tradingview-widget-container,
#ticker-band .tradingview-widget-container__widget {
    width: 100%;
    height: 100%;
}

/* =========================================
   ROW 2: DESK CONTROL BAR
   ========================================= */

#control-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    background: var(--bg-header);
    min-width: 0;
}

.desk-brand {
    display: flex;
    align-items: baseline;
    gap: 12px;
    min-width: 0;
}

.desk-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-primary);
    white-space: nowrap;
}

.desk-sub {
    font-size: 13px;
    color: var(--text-secondary);
    white-space: nowrap;
}

.desk-controls {
    display: flex;
    align-items: center;
    gap: 16px;
}

.telemetry-group {
    display: flex;
    align-items: center;
    gap: 12px;
}

.status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border: 1px solid var(--rule);
    background: var(--bg-panel);
    font-size: 12px;
    color: var(--text-secondary);
    white-space: nowrap;
}

.status-pill strong {
    color: var(--text-primary);
    font-weight: 600;
}

.status-pill.is-fallback strong {
    color: var(--amber-live);
}

.range-group {
    display: inline-flex;
    background: var(--bg-abyss);
    border: 1px solid var(--rule);
    padding: 2px;
    gap: 2px;
}

.range-btn {
    border: 0;
    background: transparent;
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    padding: 4px 11px;
    cursor: pointer;
    transition: background-color 140ms ease, color 140ms ease;
}

.range-btn:hover {
    color: var(--text-primary);
}

.range-btn:focus-visible {
    outline: 2px solid var(--up-jade);
    outline-offset: 1px;
}

.range-btn[aria-pressed="true"] {
    background: var(--up-jade);
    color: var(--bg-abyss);
}

/* =========================================
   ROW 3: 3x2 CURRENCY-MATCHED INDEX STAGE
   ========================================= */

#charts-stage {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr));
    gap: 1px;
    background: var(--rule);
    min-width: 0;
    min-height: 0;
    overflow: hidden;
}

.market-cell {
    display: grid;
    grid-template-rows: 36px 1fr;
    background: var(--bg-panel);
    min-width: 0;
    min-height: 0;
    overflow: hidden;
}

.market-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    background: var(--bg-header);
    border-bottom: 1px solid var(--rule);
    gap: 8px;
    min-width: 0;
}

.market-id {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
}

.market-flag {
    font-size: 16px;
    line-height: 1;
}

.market-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.session-pill {
    display: inline-flex;
    align-items: center;
    padding: 2px 7px;
    font-size: 11px;
    font-weight: 600;
    border: 1px solid transparent;
    white-space: nowrap;
}

.session-pill.is-open {
    color: var(--up-jade);
    background: rgba(18, 184, 134, 0.12);
    border-color: rgba(18, 184, 134, 0.35);
}

.session-pill.is-break {
    color: var(--amber-live);
    background: rgba(245, 159, 0, 0.12);
    border-color: rgba(245, 159, 0, 0.35);
}

.session-pill.is-closed {
    color: var(--text-secondary);
    background: rgba(148, 163, 184, 0.08);
    border-color: var(--rule);
}

.market-mop-chip {
    font-size: 12px;
    font-weight: 600;
    color: var(--up-jade);
    white-space: nowrap;
}

.chart-slot {
    position: relative;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: var(--bg-panel);
}

.chart-slot .tradingview-widget-container,
.chart-slot .tradingview-widget-container__widget {
    width: 100%;
    height: 100%;
}

/* =========================================
   ROWS 4-6: SEAMLESS DUAL-TRACK MARQUEE BANDS
   ========================================= */

.ticker-band {
    display: grid;
    grid-template-columns: 118px 1fr;
    align-items: stretch;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
}

.band-clock {
    background: var(--bg-clock);
}

.band-fx {
    background: var(--bg-fx);
    border-top: 1px solid var(--rule-fx);
    border-bottom: 1px solid var(--rule-fx);
}

.band-weather {
    background: var(--bg-weather);
}

.band-label {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 12px;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
    border-right: 1px solid var(--rule);
    background: rgba(6, 11, 18, 0.45);
    white-space: nowrap;
}

.band-fx .band-label {
    color: var(--up-jade);
    border-right-color: var(--rule-fx);
}

.marquee-viewport {
    position: relative;
    display: flex;
    align-items: center;
    overflow: hidden;
    min-width: 0;
}

.marquee-track {
    display: flex;
    align-items: center;
    width: max-content;
    will-change: transform;
}

.band-clock .marquee-track {
    animation: marqueeScroll 42s linear infinite;
}

.band-fx .marquee-track {
    animation: marqueeScroll 36s linear infinite;
}

.band-weather .marquee-track {
    animation: marqueeScroll 54s linear infinite;
}

.ticker-band:hover .marquee-track {
    animation-play-state: paused;
}

.marquee-group {
    display: flex;
    align-items: center;
    flex-shrink: 0;
}

/* Clock Items */

.clock-item {
    display: inline-flex;
    align-items: baseline;
    gap: 10px;
    padding: 0 28px;
    border-right: 1px solid rgba(255, 255, 255, 0.08);
    white-space: nowrap;
}

.clock-city {
    font-size: 19px;
    font-weight: 700;
    color: var(--text-primary);
}

.clock-time {
    font-size: 22px;
    font-weight: 700;
    color: #93C5FD;
}

/* MOP FX Items */

.fx-item {
    display: inline-flex;
    align-items: baseline;
    gap: 10px;
    padding: 0 28px;
    border-right: 1px solid rgba(18, 184, 134, 0.22);
    white-space: nowrap;
}

.fx-unit {
    font-size: 17px;
    font-weight: 600;
    color: var(--up-jade);
}

.fx-value {
    font-size: 21px;
    font-weight: 700;
    color: var(--text-primary);
}

.fx-delta {
    font-size: 14px;
    font-weight: 600;
}

.fx-delta.is-up {
    color: var(--up-jade);
}

.fx-delta.is-down {
    color: var(--down-coral);
}

.fx-delta.is-flat {
    color: var(--text-secondary);
}

/* Weather Items */

.wx-item {
    display: inline-flex;
    align-items: baseline;
    gap: 10px;
    padding: 0 28px;
    border-right: 1px solid rgba(255, 255, 255, 0.08);
    white-space: nowrap;
}

.wx-city {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-primary);
}

.wx-temp {
    font-size: 21px;
    font-weight: 700;
    color: #BAE6FD;
}

.wx-cond {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
}

.wx-meta {
    font-size: 13px;
    color: var(--text-secondary);
}

/* =========================================
   ANIMATIONS & ACCESSIBILITY
   ========================================= */

@keyframes marqueeScroll {
    0% {
        transform: translate3d(0, 0, 0);
    }
    100% {
        transform: translate3d(-50%, 0, 0);
    }
}

@keyframes livePulse {
    0%, 100% {
        opacity: 1;
    }
    50% {
        opacity: 0.45;
    }
}

@media (prefers-reduced-motion: reduce) {
    .marquee-track {
        animation: none !important;
    }
    .marquee-viewport {
        overflow-x: auto;
    }
    .marquee-group[aria-hidden="true"] {
        display: none;
    }
    .live-dot {
        animation: none;
    }
}

/* Responsive fallback for smaller viewports */
@media (max-width: 1024px) {
    html,
    body {
        height: auto;
        overflow-x: hidden;
        overflow-y: auto;
    }

    #dashboard {
        grid-template-columns: 1fr;
        height: auto;
    }

    #stories-sidebar {
        order: 2;
        height: 460px;
    }

    #main-stack {
        order: 1;
        grid-template-rows: 72px auto auto 58px 62px 58px;
    }

    #control-bar {
        flex-wrap: wrap;
        gap: 8px;
        padding: 8px 12px;
    }

    #charts-stage {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(3, 240px);
    }

    .ticker-band {
        grid-template-columns: 92px 1fr;
    }
}

@media (max-width: 640px) {
    #charts-stage {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(6, 220px);
    }

    .desk-sub {
        display: none;
    }
}
</style>

    </main>

            dot.classList.toggle('amber', isFallback);
        }
    }

    async function fetchJsonWithTimeout(url, timeoutMs = 8000) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
            const response = await fetch(url, { signal: controller.signal, cache: 'no-store' });
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            return await response.json();
        } finally {
            clearTimeout(timer);
        }
    }

    function readStorage(key) {
        try {
            const raw = localStorage.getItem(key);
            return raw ? JSON.parse(raw) : null;
        } catch {
            return null;
        }
    }

    function writeStorage(key, value) {
        try {
            localStorage.setItem(key, JSON.stringify(value));
        } catch {
            // Ignore storage quota or private browsing errors
        }
    }

    /* =========================================
       1. CURRENCY-MATCHED 3x2 INDEX CHARTS
       ========================================= */

    function getSessionState(market, now = new Date()) {
        const parts = new Intl.DateTimeFormat('en-US', {
            timeZone: market.zone,
            weekday: 'short',
            hour: '2-digit',
            minute: '2-digit',
            hourCycle: 'h23'
        }).formatToParts(now);

        const weekday = parts.find((p) => p.type === 'weekday')?.value;
        if (weekday === 'Sat' || weekday === 'Sun') {
            return { label: 'Closed', cls: 'is-closed' };
        }

        const hour = Number(parts.find((p) => p.type === 'hour')?.value || 0);
        const minute = Number(parts.find((p) => p.type === 'minute')?.value || 0);
        const mins = hour * 60 + minute;

        const inSession = market.sessions.some(([start, end]) => mins >= start && mins < end);
        if (inSession) {
            return { label: 'Open', cls: 'is-open' };
        }

        if (market.sessions.length > 1) {
            const firstStart = market.sessions[0][0];
            const lastEnd = market.sessions[market.sessions.length - 1][1];
            if (mins >= firstStart && mins < lastEnd) {
                return { label: 'Break', cls: 'is-break' };
            }
        }

        return { label: 'Closed', cls: 'is-closed' };
    }

    function buildChartStage() {
        const stage = document.getElementById('charts-stage');
        stage.textContent = '';

        MARKETS.forEach((market) => {
            const cell = document.createElement('article');
            cell.className = 'market-cell';
            cell.dataset.code = market.code;

            const head = document.createElement('div');
            head.className = 'market-head';

            const idWrap = document.createElement('div');
            idWrap.className = 'market-id';

            const flag = document.createElement('span');
            flag.className = 'market-flag';
            flag.textContent = market.flag;

            const name = document.createElement('span');
            name.className = 'market-name';
            name.textContent = market.indexName;

            const session = document.createElement('span');
            session.className = 'session-pill is-closed';
            session.id = `session-${market.code}`;

            idWrap.append(flag, name, session);

            const mopChip = document.createElement('span');
            mopChip.className = 'market-mop-chip tabular';
            mopChip.id = `chart-mop-${market.code}`;
            mopChip.textContent = `${market.unit} ${market.code} = ${market.fallbackMop.toFixed(4)} MOP`;

            head.append(idWrap, mopChip);

            const slot = document.createElement('div');
            slot.className = 'chart-slot';
            slot.id = `chart-slot-${market.code}`;

            cell.append(head, slot);
            stage.appendChild(cell);
        });

        updateSessionPills();
        mountAllCharts(activeRange);
    }

    function updateSessionPills() {
        const now = new Date();
        MARKETS.forEach((market) => {
            const pill = document.getElementById(`session-${market.code}`);
            if (!pill) return;
            const state = getSessionState(market, now);
            pill.textContent = state.label;
            pill.className = `session-pill ${state.cls}`;
        });
    }

    function mountAllCharts(dateRange) {
        MARKETS.forEach((market) => {
            const slot = document.getElementById(`chart-slot-${market.code}`);
            if (!slot) return;
            slot.textContent = '';

            const container = document.createElement('div');
            container.className = 'tradingview-widget-container';

            const widgetTarget = document.createElement('div');
            widgetTarget.className = 'tradingview-widget-container__widget';

            const script = document.createElement('script');
            script.type = 'text/javascript';
            script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js';
            script.async = true;
            script.textContent = JSON.stringify({
                symbol: market.symbol,
                width: '100%',
                height: '100%',
                locale: 'en',
                dateRange,
                colorTheme: 'dark',
                isTransparent: true,
                autosize: true,
                largeChartUrl: '',
                chartOnly: false
            });

            container.append(widgetTarget, script);
            slot.appendChild(container);
        });
    }

    function setupRangeButtons() {
        const buttons = document.querySelectorAll('.range-btn');
        buttons.forEach((btn) => {
            btn.addEventListener('click', () => {
                const nextRange = btn.dataset.range;
                if (!nextRange || nextRange === activeRange) return;
                activeRange = nextRange;
                buttons.forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
                mountAllCharts(activeRange);
            });
        });
    }

    /* =========================================
       2. WORLD CLOCKS (ALIGNED 8 HUBS)
       ========================================= */

    function initClockMarkup() {
        const track = document.getElementById('clock-track');
        const groupA = track.querySelector('[data-group="a"]');
        const groupB = track.querySelector('[data-group="b"]');

        const createGroupNodes = (suffix) => {
            const frag = document.createDocumentFragment();
            HUBS.forEach((hub) => {
                const item = document.createElement('span');
                item.className = 'clock-item';

                const city = document.createElement('span');
                city.className = 'clock-city';
                city.textContent = `${hub.icon} ${hub.city}`;

                const time = document.createElement('span');
                time.className = 'clock-time tabular';
                time.dataset.clockId = hub.id;
                time.id = `clock-${hub.id}-${suffix}`;
                time.textContent = '--:--:--';

                item.append(city, time);
                frag.appendChild(item);
            });
            return frag;
        };

        groupA.appendChild(createGroupNodes('a'));
        groupB.appendChild(createGroupNodes('b'));
    }

    function updateClocks() {
        const now = new Date();
        HUBS.forEach((hub) => {
            const formatted = now.toLocaleTimeString('en-US', {
                timeZone: hub.zone,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            });
            document.querySelectorAll(`[data-clock-id="${hub.id}"]`).forEach((el) => {
                el.textContent = formatted;
            });
        });
        updateSessionPills();
    }

    /* =========================================
       3. REAL-TIME MOP EXCHANGE RATES
       ========================================= */

    function renderMopRates(mopRates, sourceName, isFallback) {
        const track = document.getElementById('fx-track');
        const groupA = track.querySelector('[data-group="a"]');
        const groupB = track.querySelector('[data-group="b"]');

        const buildGroup = () => {
            const frag = document.createDocumentFragment();
            MARKETS.forEach((market) => {
                const rate = mopRates[market.code];
                const prev = previousMopRates ? previousMopRates[market.code] : null;
                const diff = prev != null ? rate - prev : 0;

                const item = document.createElement('span');
                item.className = 'fx-item';

                const unit = document.createElement('span');
                unit.className = 'fx-unit';
                unit.textContent = `${market.flag} ${market.unit} ${market.code} =`;

                const val = document.createElement('span');
                val.className = 'fx-value tabular';
                val.textContent = `${rate.toFixed(4)} MOP`;

                const delta = document.createElement('span');
                delta.className = 'fx-delta tabular';
                if (prev == null || Math.abs(diff) < 0.00005) {
                    delta.classList.add('is-flat');
                    delta.textContent = '• 0.0000';
                } else if (diff > 0) {
                    delta.classList.add('is-up');
                    delta.textContent = `▲ +${diff.toFixed(4)}`;
                } else {
                    delta.classList.add('is-down');
                    delta.textContent = `▼ ${diff.toFixed(4)}`;
                }

                item.append(unit, val, delta);
                frag.appendChild(item);
            });
            return frag;
        };

        groupA.textContent = '';
        groupB.textContent = '';
        groupA.appendChild(buildGroup());
        groupB.appendChild(buildGroup());

        // Sync live MOP spot into each of the 6 index chart headers
        MARKETS.forEach((market) => {
            const chip = document.getElementById(`chart-mop-${market.code}`);
            if (chip) {
                chip.textContent = `${market.unit} ${market.code} = ${mopRates[market.code].toFixed(4)} MOP`;
            }
        });

        previousMopRates = { ...mopRates };
        setTelemetry('fx-status', 'fx-status-text', `${sourceName} ${formatSyncClock()}`, isFallback);
    }

    async function fetchMopRates() {
        const providers = [
            {
                name: 'Coinbase',
                url: 'https://api.coinbase.com/v2/exchange-rates?currency=MOP',
                extract: (json) => json?.data?.rates
            },
            {
                name: 'Open ER',
                url: 'https://open.er-api.com/v6/latest/MOP',
                extract: (json) => json?.rates
            },
            {
                name: 'FX CDN',
                url: 'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/mop.min.json',
                extract: (json) => json?.mop
                    ? Object.fromEntries(Object.entries(json.mop).map(([k, v]) => [k.toUpperCase(), v]))
                    : null
            }
        ];

        for (const provider of providers) {
            try {
                const json = await fetchJsonWithTimeout(provider.url);
                const rawRates = provider.extract(json);
                if (!rawRates) continue;

                const computed = {};
                let valid = true;
                for (const market of MARKETS) {
                    const perMop = Number(rawRates[market.code]);
                    if (!Number.isFinite(perMop) || perMop <= 0) {
                        valid = false;
                        break;
                    }
                    computed[market.code] = market.unit / perMop;
                }

                if (valid) {
                    writeStorage(FX_STORAGE_KEY, { rates: computed, savedAt: Date.now() });
                    renderMopRates(computed, provider.name, false);
                    return;
                }
            } catch {
                // Continue to next failover provider
            }
        }

        const cached = readStorage(FX_STORAGE_KEY);
        if (cached?.rates) {
            renderMopRates(cached.rates, 'Cached', true);
            return;
        }

        const baseline = Object.fromEntries(MARKETS.map((m) => [m.code, m.fallbackMop]));
        renderMopRates(baseline, 'Baseline', true);
    }

    /* =========================================
       4. REAL-TIME MULTI-CITY WEATHER (OPEN-METEO)
       ========================================= */

    function decodeWmoWeather(code, isDay) {
        const day = isDay !== 0;
        if (code === 0) return { icon: day ? '☀️' : '🌙', label: 'Clear' };
        if (code === 1) return { icon: day ? '🌤️' : '🌙', label: 'Mainly clear' };
        if (code === 2) return { icon: day ? '⛅' : '☁️', label: 'Partly cloudy' };
        if (code === 3) return { icon: '☁️', label: 'Overcast' };
        if (code === 45 || code === 48) return { icon: '🌫️', label: 'Fog' };
        if (code >= 51 && code <= 57) return { icon: '🌦️', label: 'Drizzle' };
        if (code >= 61 && code <= 67) return { icon: '🌧️', label: 'Rain' };
        if (code >= 71 && code <= 77) return { icon: '❄️', label: 'Snow' };
        if (code >= 80 && code <= 82) return { icon: '🌦️', label: 'Showers' };
        if (code === 85 || code === 86) return { icon: '🌨️', label: 'Snow showers' };
        if (code >= 95) return { icon: '⛈️', label: 'Thunderstorm' };
        return { icon: '🌡️', label: 'Current' };
    }

    function renderWeather(entries, sourceName, isFallback) {
        const track = document.getElementById('wx-track');
        const groupA = track.querySelector('[data-group="a"]');
        const groupB = track.querySelector('[data-group="b"]');

        const buildGroup = () => {
            const frag = document.createDocumentFragment();
            entries.forEach((entry) => {
                const item = document.createElement('span');
                item.className = 'wx-item';

                const city = document.createElement('span');
                city.className = 'wx-city';
                city.textContent = `${entry.weatherIcon} ${entry.city}`;

                const temp = document.createElement('span');
                temp.className = 'wx-temp tabular';
                temp.textContent = `${entry.temp.toFixed(1)}°C`;

                const cond = document.createElement('span');
                cond.className = 'wx-cond';
                cond.textContent = entry.condition;

                const meta = document.createElement('span');
                meta.className = 'wx-meta tabular';
                meta.textContent = `Feels ${entry.feels.toFixed(0)}°C  |  Hum ${Math.round(entry.humidity)}%  |  Wind ${Math.round(entry.wind)} km/h`;

                item.append(city, temp, cond, meta);
                frag.appendChild(item);
            });
            return frag;
        };

        groupA.textContent = '';
        groupB.textContent = '';
        groupA.appendChild(buildGroup());
        groupB.appendChild(buildGroup());

        setTelemetry('wx-status', 'wx-status-text', `${sourceName} ${formatSyncClock()}`, isFallback);
    }

    async function fetchWeather() {
        const lats = HUBS.map((h) => h.lat).join(',');
        const lons = HUBS.map((h) => h.lon).join(',');
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=temperature_2m,apparent_temperature,weather_code,relative_humidity_2m,wind_speed_10m,is_day&timezone=auto`;

        try {
            const payload = await fetchJsonWithTimeout(url, 9000);
            const list = Array.isArray(payload) ? payload : [payload];
            if (list.length !== HUBS.length) {
                throw new Error('Unexpected city count in Open-Meteo response');
            }

            const entries = HUBS.map((hub, idx) => {
                const cur = list[idx]?.current;
                if (!cur) throw new Error(`Missing current block for ${hub.city}`);
                const decoded = decodeWmoWeather(Number(cur.weather_code), Number(cur.is_day));
                return {
                    city: hub.city,
                    weatherIcon: decoded.icon,
                    condition: decoded.label,
                    temp: Number(cur.temperature_2m),
                    feels: Number(cur.apparent_temperature),
                    humidity: Number(cur.relative_humidity_2m),
                    wind: Number(cur.wind_speed_10m)
                };
            });

            writeStorage(WX_STORAGE_KEY, { entries, savedAt: Date.now() });
            renderWeather(entries, 'Open-Meteo', false);
            return;
        } catch {
            const cached = readStorage(WX_STORAGE_KEY);
            if (cached?.entries?.length) {
                renderWeather(cached.entries, 'Cached', true);
                return;
            }
            setTelemetry('wx-status', 'wx-status-text', 'Unavailable', true);
        }
    }

    /* =========================================
       BOOTSTRAP
       ========================================= */

    buildChartStage();
    setupRangeButtons();
    initClockMarkup();
    updateClocks();
    setInterval(updateClocks, 1000);

    fetchMopRates();
    setInterval(fetchMopRates, FX_POLL_MS);

    fetchWeather();
    setInterval(fetchWeather, WX_POLL_MS);
})();
</script>
