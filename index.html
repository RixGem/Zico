<!DOCTYPE html><html><head><title>Zico Markets</title></head><body><aside id="stories-sidebar"><header><h2>TOP STORIES</h2><nav><button id="tab-wire" aria-selected="true">Wire</button><button id="tab-tv" aria-selected="false">TradingView</button><button id="wire-toggle">Pause</button></nav></header><section id="wire-frame"></section></aside><script>
(()=>{'use strict';const feeds=[['Reuters','https://www.reuters.com/world/'],['CNBC','https://www.cnbc.com/id/100003114/device/rss/rss.html'],['MarketWatch','https://feeds.marketwatch.com/marketwatch/topstories/'],['Yahoo Finance','https://finance.yahoo.com/news/rssindex']],proxy='https://api.rss2json.com/v1/api.json?rss_url=',frame=document.querySelector('#wire-frame'),sidebar=document.querySelector('#stories-sidebar');let view='wire',paused=false,tv=false,signature='';function safe(x){try{const u=new URL(x);return /^https?:$/.test(u.protocol)?u.href:null}catch{return null}}function age(t){const m=Math.max(0,Math.round((Date.now()-t)/60000));return m<1?'Just now':m<60?m+'m ago':Math.round(m/60)+'h ago'}async function stories(){const responses=await Promise.allSettled(feeds.map(async([source,url])=>{const r=await fetch(proxy+encodeURIComponent(url));const j=await r.json();if(j.status!=='ok')throw Error();return j.items.map(i=>({source,title:String(i.title||'').replace(/<[^>]*>/g,'').trim(),link:safe(i.link),time:Date.parse(i.pubDate)}))}));const seen=new Set(),items=[];for(const r of responses)if(r.status==='fulfilled')for(const x of r.value){const k=x.title.toLowerCase();if(x.title&&x.link&&!seen.has(k)){seen.add(k);items.push(x)}}return items.sort((a,b)=>(b.time||0)-(a.time||0)).slice(0,24)}function list(items,clone){const ul=document.createElement('ul');ul.className='wire-list';for(const x of items){const li=document.createElement('li'),a=document.createElement('a'),meta=document.createElement('small');a.href=x.link;a.target='_blank';a.rel='noopener noreferrer';if(clone)a.tabIndex=-1;meta.textContent=x.source+' · '+(Number.isFinite(x.time)?age(x.time):'');a.append(meta,document.createElement('br'),document.createTextNode(x.title));li.append(a);ul.append(li)}return ul}function render(items){const sig=items.map(x=>x.link).join('|');if(view!=='wire'||sig===signature)return;signature=sig;const track=document.createElement('div');track.className='wire-track';track.append(list(items,false),list(items,true));frame.replaceChildren(track)}function tvMode(){if(tv)return;tv=true;const track=document.createElement('div'),box=document.createElement('div'),slot=document.createElement('div'),script=document.createElement('script');track.className='tv-track';box.className='tradingview-widget-container';slot.className='tradingview-widget-container__widget';script.async=true;script.src='https://s3.tradingview.com/external-embedding/embed-widget-timeline.js';script.textContent=JSON.stringify({feedMode:'all_symbols',displayMode:'regular',isTransparent:true,colorTheme:'dark',locale:'en',width:'100%',height:'100%'});box.append(slot,script);track.append(box);frame.replaceChildren(track)}async function refresh(){try{const items=await stories();if(items.length>=3){localStorage.setItem('zico_market_wire_v1',JSON.stringify(items));render(items);return}}catch{}try{const cached=JSON.parse(localStorage.getItem('zico_market_wire_v1')||'[]');if(cached.length)render(cached);else frame.textContent='Headlines temporarily unavailable.'}catch{frame.textContent='Headlines temporarily unavailable.'}}function setView(v){view=v;document.querySelector('#tab-wire').setAttribute('aria-selected',String(v==='wire'));document.querySelector('#tab-tv').setAttribute('aria-selected',String(v==='tv'));if(v==='tv')tvMode();else{tv=false;signature='';refresh()}}document.querySelector('#tab-wire').onclick=()=>setView('wire');document.querySelector('#tab-tv').onclick=()=>setView('tv');document.querySelector('#wire-toggle').onclick=e=>{paused=!paused;sidebar.classList.toggle('paused',paused);e.currentTarget.textContent=paused?'Play':'Pause'};setView('wire');setInterval(()=>{if(view==='wire')refresh()},300000);})();
</script><style>
*{box-sizing:border-box}body{margin:0;background:#060b12;color:#f1f5f9;font:14px Arial,sans-serif}#stories-sidebar{width:20vw;height:100vh;background:#0b1320;overflow:hidden;display:grid;grid-template-rows:92px minmax(0,1fr)}header{padding:8px 12px;background:#09111d;border-bottom:1px solid #1c2b40}h2{font-size:15px;margin:0 0 9px}nav{display:flex;gap:6px}button{background:#060b12;border:1px solid #1c2b40;color:#94a3b8;padding:5px 8px;cursor:pointer}button[aria-selected=true]{color:#f1f5f9;background:#14253a}.wire-list{list-style:none;margin:0;padding:0}.wire-list li{border-bottom:1px solid #1c2b40}.wire-list a{display:block;padding:13px 12px;color:#f1f5f9;text-decoration:none;line-height:1.4}.wire-list small{color:#93c5fd}.wire-track{animation:wire 110s linear infinite}.paused .wire-track,.paused .tv-track{animation-play-state:paused}.tv-track{position:relative;width:121.95%;height:200%;transform-origin:top left;transform:scale(.82);animation:tvscroll 55s linear infinite}.tv-track .tradingview-widget-container,.tv-track .tradingview-widget-container__widget{height:100%;width:100%}@keyframes wire{to{transform:translateY(-50%)}}@keyframes tvscroll{from{transform:translateY(100%) scale(.82)}to{transform:translateY(-100%) scale(.82)}}@media(prefers-reduced-motion:reduce){.wire-track,.tv-track{animation:none!important}}@media(max-width:700px){#stories-sidebar{width:100vw;height:480px}}
</style></body></html>
