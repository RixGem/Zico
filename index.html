<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Zico — Global Markets TV Dashboard</title><script src="securities.js"></script><style>
:root{--bg-abyss:#060B12;--bg-panel:#0B1320;--bg-header:#09111D;--bg-clock:#081629;--bg-fx:#061813;--bg-weather:#091C32;--rule:#1C2B40;--rule-fx:#14533D;--text-primary:#F1F5F9;--text-secondary:#94A3B8;--up-jade:#12B886;--down-coral:#F05252;--amber-live:#F59F00;--font-ui:Arial,sans-serif;--font-mono:monospace}*{margin:0;padding:0;box-sizing:border-box}html,body{width:100vw;height:100vh;overflow:hidden;background:var(--bg-abyss);color:var(--text-primary);font-family:var(--font-ui)}.tabular{font-family:var(--font-mono);font-variant-numeric:tabular-nums}#dashboard{display:grid;grid-template-columns:20vw 80vw;width:100vw;height:100vh;background:var(--rule);gap:1px}#stories-sidebar{display:grid;grid-template-rows:72px minmax(0,1fr);background:var(--bg-panel);min-width:0;min-height:0;overflow:hidden}.sidebar-head{display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:var(--bg-header);border-bottom:1px solid var(--rule)}.sidebar-title{font-size:15px;font-weight:700}.sidebar-sub{font-size:12px;color:var(--text-secondary)}.sidebar-tools{display:flex;align-items:center;gap:10px}.live-tag{color:var(--up-jade);font-size:12px}.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--up-jade);animation:livePulse 2.2s infinite}.wire-toggle{border:1px solid var(--rule);background:var(--bg-abyss);color:var(--text-secondary);padding:4px 10px;cursor:pointer}.stories-frame{position:relative;width:100%;height:100%;min-height:0;overflow:hidden;background:var(--bg-panel)}.wire-viewport{height:100%;overflow:hidden}.wire-track{will-change:transform;animation:wireScroll var(--wire-duration,120s) linear infinite}.wire-viewport:hover .wire-track,.wire-viewport:focus-within .wire-track,#stories-sidebar.is-paused .wire-track,#stories-sidebar.is-paused .wire-fallback{animation-play-state:paused}.wire-list{list-style:none}.wire-item{border-bottom:1px solid var(--rule)}.wire-link{display:block;padding:14px 16px 16px;color:inherit;text-decoration:none}.wire-meta{display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px;color:var(--text-secondary)}.wire-source{color:#93C5FD}.wire-headline{font-size:15px;font-weight:600;line-height:1.4}.wire-status{padding:18px 16px;color:var(--text-secondary)}.wire-fallback{height:200%;animation:wireFallback 90s linear infinite alternate}.wire-fallback .tradingview-widget-container,.wire-fallback .tradingview-widget-container__widget{width:100%;height:100%}#main-stack{display:grid;grid-template-rows:auto 52px minmax(0,1fr) 8.2vh 9vh 8.2vh;min-width:0;min-height:0;background:var(--rule);gap:1px}#ticker-deck{display:grid;grid-template-rows:repeat(2,76px);gap:1px;background:var(--rule);min-width:0}.tape-row{display:grid;grid-template-columns:118px minmax(0,1fr);background:var(--bg-header);overflow:hidden}.tape-label{display:flex;flex-direction:column;justify-content:center;padding:0 14px;font-size:15px;font-weight:700;border-right:1px solid var(--rule)}.tape-label small{font-size:12px;color:var(--text-secondary)}.tape-slot{display:flex;align-items:center;min-width:0;overflow:hidden}.tape-slot .tradingview-widget-container{width:100%}#control-bar{display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--bg-header);min-width:0}.desk-brand{display:flex;align-items:baseline;gap:12px}.desk-title{font-size:16px}.desk-sub{font-size:13px;color:var(--text-secondary)}.session-board{display:flex;align-items:center;gap:6px;list-style:none}.session-pill{display:inline-flex;gap:6px;padding:3px 8px;font-size:12px;border:1px solid transparent;white-space:nowrap}.session-pill.is-open{color:var(--up-jade);background:#12b8861f;border-color:#12b88659}.session-pill.is-break{color:var(--amber-live)}.session-pill.is-closed{color:var(--text-secondary)}#open-stage{background:var(--bg-abyss);min-width:0;min-height:0}.ticker-band{display:grid;grid-template-columns:118px 1fr;overflow:hidden;min-width:0;min-height:0}.band-clock{background:var(--bg-clock)}.band-fx{background:var(--bg-fx);border-block:1px solid var(--rule-fx)}.band-weather{background:var(--bg-weather)}.band-label{display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;border-right:1px solid var(--rule)}.marquee-viewport{display:flex;align-items:center;overflow:hidden;min-width:0}.marquee-track{display:flex;align-items:center;width:max-content;will-change:transform}.band-clock .marquee-track{animation:marqueeScroll 42s linear infinite}.band-fx .marquee-track{animation:marqueeScroll 36s linear infinite}.band-weather .marquee-track{animation:marqueeScroll 54s linear infinite}.ticker-band:hover .marquee-track{animation-play-state:paused}.marquee-group{display:flex;align-items:center;flex-shrink:0}.clock-item,.fx-item,.wx-item{display:inline-flex;align-items:baseline;gap:10px;padding:0 24px;border-right:1px solid #ffffff18;white-space:nowrap}.clock-city,.wx-city{font-size:18px;font-weight:700}.clock-time{font-size:22px;color:#93C5FD}.fx-unit{color:var(--up-jade)}.fx-value{font-size:21px;font-weight:700}.fx-delta{font-size:13px}.fx-delta.is-up{color:var(--up-jade)}.fx-delta.is-down{color:var(--down-coral)}.fx-delta.is-flat{color:var(--text-secondary)}.wx-temp{font-size:21px;color:#BAE6FD}.wx-cond{font-size:14px}.wx-meta{font-size:12px;color:var(--text-secondary)}@keyframes marqueeScroll{to{transform:translate3d(-50%,0,0)}}@keyframes livePulse{50%{opacity:.45}}@keyframes wireScroll{to{transform:translate3d(0,-50%,0)}}@keyframes wireFallback{to{transform:translate3d(0,-50%,0)}}@media(prefers-reduced-motion:reduce){.marquee-track,.wire-track,.wire-fallback{animation:none!important}.marquee-viewport{overflow-x:auto}.wire-viewport{overflow-y:auto}.wire-fallback{height:100%}.marquee-group[aria-hidden=true],.wire-list[aria-hidden=true]{display:none}}@media(max-height:860px) and (min-width:1025px){#ticker-deck{grid-template-rows:repeat(2,66px)}}@media(max-width:1024px){html,body{height:auto;overflow-x:hidden;overflow-y:auto}#dashboard{grid-template-columns:1fr;height:auto}#stories-sidebar{order:2;height:480px}#main-stack{order:1;grid-template-rows:auto auto 58px 62px 58px}#control-bar{flex-wrap:wrap;gap:8px;padding:10px 12px}.session-board{flex-wrap:wrap}#open-stage{display:none}.ticker-band,.tape-row{grid-template-columns:92px minmax(0,1fr)}}
</style></head><body><div id="dashboard"><aside id="stories-sidebar" aria-labelledby="wire-title"><div class="sidebar-head"><div><h2 class="sidebar-title" id="wire-title">Top stories</h2><span class="sidebar-sub">Market wire</span></div><div class="sidebar-tools"><span class="live-tag"><span class="live-dot"></span>Live</span><button class="wire-toggle" id="wire-toggle" type="button">Pause</button></div></div><div class="stories-frame" id="wire-frame"><p class="wire-status">Loading headlines…</p></div></aside><main id="main-stack"><section id="ticker-deck"><div class="tape-row"><div class="tape-label">Indices<small>and equities</small></div><div class="tape-slot" id="tape-indices"></div></div><div class="tape-row"><div class="tape-label">FX majors<small>and macro</small></div><div class="tape-slot" id="tape-macro"></div></div></section><header id="control-bar"><div class="desk-brand"><h1 class="desk-title">Zico — Macau FX &amp; Global Index Desk</h1><span class="desk-sub">Live indices, FX majors, MOP spot and hub weather</span></div><ul class="session-board" id="session-board"></ul></header><div id="open-stage"></div><section class="ticker-band band-clock"><div class="band-label">Clocks</div><div class="marquee-viewport"><div class="marquee-track" id="clock-track"><div class="marquee-group" data-group="a"></div><div class="marquee-group" data-group="b" aria-hidden="true"></div></div></div></section><section class="ticker-band band-fx"><div class="band-label">MOP Spot</div><div class="marquee-viewport"><div class="marquee-track" id="fx-track"><div class="marquee-group" data-group="a"></div><div class="marquee-group" data-group="b" aria-hidden="true"></div></div></div></section><section class="ticker-band band-weather"><div class="band-label">Weather</div><div class="marquee-viewport"><div class="marquee-track" id="wx-track"><div class="marquee-group" data-group="a"></div><div class="marquee-group" data-group="b" aria-hidden="true"></div></div></section></main></div><script>
(()=>{'use strict';
const MARKETS=[{code:'USD',flag:'🇺🇸',city:'New York',zone:'America/New_York',sessions:[[570,960]],fallbackMop:8.078},{code:'EUR',flag:'🇪🇺',city:'Frankfurt',zone:'Europe/Berlin',sessions:[[540,1050]],fallbackMop:8.8126},{code:'GBP',flag:'🇬🇧',city:'London',zone:'Europe/London',sessions:[[480,990]],fallbackMop:10.5328},{code:'CHF',flag:'🇨🇭',city:'Zurich',zone:'Europe/Zurich',sessions:[[540,1050]],fallbackMop:9.5866},{code:'HKD',flag:'🇭🇰',city:'Hong Kong',zone:'Asia/Hong_Kong',sessions:[[570,720],[780,960]],fallbackMop:1.03},{code:'JPY',flag:'🇯🇵',city:'Tokyo',zone:'Asia/Tokyo',sessions:[[540,690],[750,930]],fallbackMop:5.0686}];
const HUBS=[{id:'ny',icon:'🗽',city:'New York',zone:'America/New_York',lat:40.7128,lon:-74.006},{id:'fra',icon:'🏛️',city:'Frankfurt',zone:'Europe/Berlin',lat:50.1109,lon:8.6821},{id:'lon',icon:'🎡',city:'London',zone:'Europe/London',lat:51.5074,lon:-.1278},{id:'zrh',icon:'🏔️',city:'Zurich',zone:'Europe/Zurich',lat:47.3769,lon:8.5417},{id:'hkg',icon:'🏙️',city:'Hong Kong',zone:'Asia/Hong_Kong',lat:22.3193,lon:114.1694},{id:'mac',icon:'🎰',city:'Macau',zone:'Asia/Macau',lat:22.1987,lon:113.5439},{id:'tok',icon:'🗼',city:'Tokyo',zone:'Asia/Tokyo',lat:35.6762,lon:139.6503},{id:'syd',icon:'🦘',city:'Sydney',zone:'Australia/Sydney',lat:-33.8688,lon:151.2093}];const FX_POLL_MS=60000,WX_POLL_MS=600000,WIRE_POLL_MS=300000;const STORE={fx:'zico_mop_rates_v1',prev:'zico_mop_prev_close_v1',wx:'zico_weather_v1',wire:'zico_market_wire_v1'};const read=k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}},write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};async function fetchJsonWithTimeout(url,ms=10000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{signal:c.signal,cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}
function mountTape(id,symbols){const slot=document.getElementById(id),c=document.createElement('div'),w=document.createElement('div'),sc=document.createElement('script');c.className='tradingview-widget-container';w.className='tradingview-widget-container__widget';sc.async=true;sc.src='https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js';sc.textContent=JSON.stringify({symbols,showSymbolLogo:true,isTransparent:true,displayMode:'regular',colorTheme:'dark',locale:'en'});c.append(w,sc);slot.replaceChildren(c)}mountTape('tape-indices',window.ZICO_SECURITIES||[]);mountTape('tape-macro',window.ZICO_FX||[]);
const FEEDS=[{source:'CNBC',url:'https://www.cnbc.com/id/100003114/device/rss/rss.html'},{source:'MarketWatch',url:'https://feeds.marketwatch.com/marketwatch/topstories/'},{source:'Yahoo Finance',url:'https://finance.yahoo.com/news/rssindex'}],PROXY='https://api.rss2json.com/v1/api.json?rss_url=';let wireSignature='';function age(ts){const m=Math.max(0,Math.round((Date.now()-ts)/60000));return m<1?'Just now':m<60?m+'m ago':Math.round(m/60)+'h ago'}async function refreshWire(){try{const rs=await Promise.allSettled(FEEDS.map(async f=>{const j=await fetchJsonWithTimeout(PROXY+encodeURIComponent(f.url));return j.items.map(x=>({title:String(x.title||''),link:x.link,source:f.source,ts:Date.parse(x.pubDate)}))}));const items=rs.flatMap(x=>x.status==='fulfilled'?x.value:[]).filter(x=>x.title&&x.link).sort((a,b)=>b.ts-a.ts).slice(0,20);if(items.length<3)throw Error();const sig=items.map(x=>x.link).join('|');if(sig===wireSignature)return;wireSignature=sig;const frame=document.getElementById('wire-frame'),v=document.createElement('div'),track=document.createElement('div');v.className='wire-viewport';track.className='wire-track';for(let n=0;n<2;n++){const ul=document.createElement('ul');ul.className='wire-list';if(n)ul.setAttribute('aria-hidden','true');for(const x of items){const li=document.createElement('li'),a=document.createElement('a');li.className='wire-item';a.className='wire-link';a.href=x.link;a.target='_blank';a.rel='noopener noreferrer';a.textContent=x.source+' · '+x.title;li.append(a);ul.append(li)}track.append(ul)}v.append(track);frame.replaceChildren(v)}catch{}}
function updateClocks(){for(const h of HUBS){const t=new Date().toLocaleTimeString('en-US',{timeZone:h.zone,hour:'2-digit',minute:'2-digit',second:'2-digit'});document.querySelectorAll('[data-clock-id="'+h.id+'"]').forEach(e=>e.textContent=t)}}for(const g of document.querySelectorAll('#clock-track [data-group]'))for(const h of HUBS){const item=document.createElement('span');item.className='clock-item';item.innerHTML='<span class="clock-city">'+h.icon+' '+h.city+'</span> <span class="clock-time tabular" data-clock-id="'+h.id+'">--:--:--</span>';g.append(item)}function renderFx(rates,prev={}){for(const g of document.querySelectorAll('#fx-track [data-group]')){g.replaceChildren();for(const m of MARKETS){const val=Number(rates[m.code])||m.fallbackMop,p=Number(prev[m.code]),item=document.createElement('span');item.className='fx-item';const delta=Number.isFinite(p)&&p>0?(((val-p)/p)*100).toFixed(2)+'%':'24h baseline pending';item.innerHTML='<span class="fx-unit">'+m.flag+' '+m.code+'/MOP</span> <span class="fx-value tabular">'+val.toFixed(4)+'</span> <span class="fx-delta">'+delta+'</span>';g.append(item)}}}
const YAHOO_CORS_PROXY='https://api.allorigins.win/raw?url=';function yahooChartUrl(symbol){return 'https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(symbol)+'?range=5d&interval=1d'}async function fetchYahooChart(symbol){const target=yahooChartUrl(symbol);for(const url of [target,YAHOO_CORS_PROXY+encodeURIComponent(target)])try{const j=await fetchJsonWithTimeout(url),m=j?.chart?.result?.[0]?.meta;if(!m)throw Error('No Yahoo chart data '+symbol);const price=Number(m.regularMarketPrice),previous=Number(m.chartPreviousClose??m.regularMarketPreviousClose);if(!(price>0&&previous>0))throw Error('Missing Yahoo price/previous close '+symbol);return{price,previous}}catch(e){if(url===YAHOO_CORS_PROXY+encodeURIComponent(target))throw e}throw Error('Yahoo unavailable')}async function fetchMopRates(){try{const rows=await Promise.all(MARKETS.map(async m=>[m.code,await fetchYahooChart(m.code+'MOP=X')])),rates={},prev={};for(const [code,q] of rows){rates[code]=q.price;prev[code]=q.previous}write(STORE.fx,{rates,savedAt:Date.now(),source:'Yahoo Finance'});write(STORE.prev,{rates:prev,savedAt:Date.now(),source:'Yahoo previous close'});renderFx(rates,prev)}catch{const a=read(STORE.fx),b=read(STORE.prev);renderFx(a?.rates||Object.fromEntries(MARKETS.map(m=>[m.code,m.fallbackMop])),b?.rates||{})}}
function weatherCode(n,day){if(n===0)return[day?'☀️':'🌙','Clear'];if(n<=3)return['☁️','Cloudy'];if(n<=48)return['🌫️','Fog'];if(n<=67)return['🌧️','Rain'];if(n<=77)return['❄️','Snow'];if(n<=82)return['🌦️','Showers'];if(n>=95)return['⚡','Thunderstorm'];return['🌡️','Current']}function renderWeather(entries){for(const g of document.querySelectorAll('#wx-track [data-group]')){g.replaceChildren();for(const e of entries){const i=document.createElement('span');i.className='wx-item';i.innerHTML='<span class="wx-city">'+e.icon+' '+e.city+'</span> <span class="wx-temp">'+e.temp.toFixed(1)+'°C</span> <span class="wx-cond">'+e.condition+'</span>';g.append(i)}}}async function fetchWeather(){try{const url='https://api.open-meteo.com/v1/forecast?latitude='+HUBS.map(h=>h.lat).join(',')+'&longitude='+HUBS.map(h=>h.lon).join(',')+'&current=temperature_2m,weather_code,is_day&timezone=auto',data=await fetchJsonWithTimeout(url),list=Array.isArray(data)?data:[data],entries=HUBS.map((h,i)=>{const c=list[i].current,[icon,condition]=weatherCode(+c.weather_code,+c.is_day);return{city:h.city,icon,condition,temp:+c.temperature_2m}});write(STORE.wx,{entries,savedAt:Date.now()});renderWeather(entries)}catch{const c=read(STORE.wx);if(c?.entries)renderWeather(c.entries)}}
const weatherCache=read(STORE.wx);if(weatherCache?.entries)renderWeather(weatherCache.entries);const oldFx=read(STORE.fx);if(oldFx?.rates)renderFx(oldFx.rates,read(STORE.prev)?.rates||{});refreshWire();setInterval(refreshWire,WIRE_POLL_MS);updateClocks();setInterval(updateClocks,1000);fetchMopRates();setInterval(fetchMopRates,FX_POLL_MS);fetchWeather();setInterval(fetchWeather,WX_POLL_MS)
})();
</script></body></html>
