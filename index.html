<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Zico — Global Markets TV Dashboard</title>
<script src="securities.js"></script>
<style>
:root{--bg-abyss:#060B12;--bg-panel:#0B1320;--bg-header:#09111D;--bg-clock:#081629;--bg-fx:#061813;--bg-weather:#091C32;--rule:#1C2B40;--rule-fx:#14533D;--text-primary:#F1F5F9;--text-secondary:#94A3B8;--up-jade:#12B886;--down-coral:#F05252;--amber-live:#F59F00;--font-ui:Arial,sans-serif;--font-mono:monospace}*{margin:0;padding:0;box-sizing:border-box}html,body{width:100vw;height:100vh;overflow:hidden;background:var(--bg-abyss);color:var(--text-primary);font-family:var(--font-ui)}.tabular{font-family:var(--font-mono);font-variant-numeric:tabular-nums}#dashboard{display:grid;grid-template-columns:20vw 80vw;width:100vw;height:100vh;background:var(--rule);gap:1px}#stories-sidebar{display:grid;grid-template-rows:86px minmax(0,1fr);background:var(--bg-panel);min-width:0;min-height:0;overflow:hidden}.sidebar-head{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;align-content:center;gap:6px;padding:7px 10px;background:var(--bg-header);border-bottom:1px solid var(--rule)}.sidebar-title{font-size:14px;font-weight:700}.sidebar-sub{font-size:10px;color:var(--text-secondary);letter-spacing:.08em}.view-tabs{display:flex;gap:2px}.view-tab,.wire-toggle{border:1px solid var(--rule);background:var(--bg-abyss);color:var(--text-secondary);padding:4px 7px;font:600 10px var(--font-ui);cursor:pointer}.view-tab.active,.view-tab[aria-selected=true]{color:var(--text-primary);background:#14253a}.sidebar-tools{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between}.live-tag{color:var(--up-jade);font-size:11px}.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--up-jade);animation:livePulse 2.2s infinite}.stories-frame{position:relative;width:100%;height:100%;min-height:0;overflow:hidden;background:var(--bg-panel)}.wire-view-panel,.tv-view-panel{position:absolute;inset:0;overflow:hidden}.wire-viewport{height:100%;overflow:hidden}.wire-track{will-change:transform;animation:wireScroll var(--wire-duration,120s) linear infinite}.wire-viewport:hover .wire-track,.wire-viewport:focus-within .wire-track,#stories-sidebar.is-paused .wire-track,#stories-sidebar.is-paused .tv-marquee{animation-play-state:paused}.wire-list{list-style:none}.wire-item{border-bottom:1px solid var(--rule)}.wire-link{display:block;padding:12px;color:inherit;text-decoration:none}.wire-link:hover{background:#ffffff08}.wire-meta{display:flex;justify-content:space-between;gap:6px;margin-bottom:6px;font-size:11px;color:var(--text-secondary)}.wire-source{color:#93C5FD}.wire-headline{font-size:13px;font-weight:600;line-height:1.4}.wire-status{padding:16px 12px;color:var(--text-secondary);font-size:12px}.tv-viewport{height:100%;overflow:hidden;position:relative}.tv-marquee{position:absolute;top:0;left:0;width:121.95%;height:200%;transform-origin:top left;animation:tvScroll 55s linear infinite}.tv-marquee .tradingview-widget-container,.tv-marquee .tradingview-widget-container__widget{width:100%;height:100%}#main-stack{display:grid;grid-template-rows:auto 52px minmax(0,1fr) 8.2vh 9vh 8.2vh;min-width:0;min-height:0;background:var(--rule);gap:1px}#ticker-deck{display:grid;grid-template-rows:repeat(3,76px);gap:1px;background:var(--rule);min-width:0}.tape-row{display:grid;grid-template-columns:118px minmax(0,1fr);background:var(--bg-header);overflow:hidden}.tape-label{display:flex;flex-direction:column;justify-content:center;padding:0 14px;font-size:15px;font-weight:700;border-right:1px solid var(--rule)}.tape-label small{font-size:12px;color:var(--text-secondary)}.tape-slot{display:flex;align-items:center;min-width:0;overflow:hidden}.tape-slot .tradingview-widget-container{width:100%}#control-bar{display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--bg-header);min-width:0}.desk-brand{display:flex;align-items:baseline;gap:12px}.desk-title{font-size:16px}.desk-sub{font-size:13px;color:var(--text-secondary)}.session-board{display:flex;align-items:center;gap:6px;list-style:none}.session-pill{display:inline-flex;gap:6px;padding:3px 8px;font-size:12px;border:1px solid transparent;white-space:nowrap}.session-pill.is-open{color:var(--up-jade);background:#12b8861f;border-color:#12b88659}.session-pill.is-break{color:var(--amber-live)}.session-pill.is-closed{color:var(--text-secondary)}#open-stage{background:var(--bg-abyss);min-width:0;min-height:0}.ticker-band{display:grid;grid-template-columns:118px 1fr;overflow:hidden;min-width:0;min-height:0}.band-clock{background:var(--bg-clock)}.band-fx{background:var(--bg-fx);border-block:1px solid var(--rule-fx)}.band-weather{background:var(--bg-weather)}.band-label{display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;border-right:1px solid var(--rule)}.marquee-viewport{display:flex;align-items:center;overflow:hidden;min-width:0}.marquee-track{display:flex;align-items:center;width:max-content;will-change:transform}.band-clock .marquee-track{animation:marqueeScroll 42s linear infinite}.band-weather .marquee-track{animation:marqueeScroll 54s linear infinite}.ticker-band:hover .marquee-track{animation-play-state:paused}.marquee-group{display:flex;align-items:center;flex-shrink:0}.clock-item,.wx-item{display:inline-flex;align-items:baseline;gap:10px;padding:0 24px;border-right:1px solid #ffffff18;white-space:nowrap}.clock-city,.wx-city{font-size:18px;font-weight:700}.clock-time{font-size:22px;color:#93C5FD}.wx-temp{font-size:21px;color:#BAE6FD}.wx-cond{font-size:14px}.wx-meta{font-size:12px;color:var(--text-secondary)}.fx-widget-slot{width:100%;height:100%;min-width:0;overflow:hidden;display:flex;align-items:center;justify-content:center}.fx-widget-slot .tradingview-widget-container,.fx-widget-slot .tradingview-widget-container__widget{width:100%;height:100%}@keyframes marqueeScroll{to{transform:translate3d(-50%,0,0)}}@keyframes livePulse{50%{opacity:.45}}@keyframes wireScroll{to{transform:translate3d(0,-50%,0)}}@keyframes tvScroll{from{transform:translateY(100%) scale(.82)}to{transform:translateY(-100%) scale(.82)}}@media(prefers-reduced-motion:reduce){.marquee-track,.wire-track,.tv-marquee{animation:none!important}.wire-viewport,.tv-viewport{overflow:auto}.marquee-group[aria-hidden=true],.wire-list[aria-hidden=true]{display:none}.live-dot{animation:none}}@media(max-height:860px) and (min-width:1025px){#ticker-deck{grid-template-rows:repeat(3,66px)}}@media(max-width:1024px){html,body{height:auto;overflow-x:hidden;overflow-y:auto}#dashboard{grid-template-columns:1fr;height:auto}#stories-sidebar{order:2;height:480px}#main-stack{order:1;grid-template-rows:auto auto 58px 62px 58px}#control-bar{flex-wrap:wrap;gap:8px;padding:10px 12px}.session-board{flex-wrap:wrap}#open-stage{display:none}.ticker-band,.tape-row{grid-template-columns:92px minmax(0,1fr)}}
</style>
</head>
<body>
<div id="dashboard"><aside id="stories-sidebar" aria-labelledby="wire-title"><header class="sidebar-head"><div><h2 class="sidebar-title" id="wire-title">TOP STORIES</h2><span class="sidebar-sub">MARKET WIRE</span></div><nav class="view-tabs" role="tablist" aria-label="News view"><button class="view-tab active" id="tab-wire" role="tab" aria-selected="true">Wire</button><button class="view-tab" id="tab-tv" role="tab" aria-selected="false">TradingView</button></nav><div class="sidebar-tools"><span class="live-tag"><span class="live-dot"></span>LIVE</span><button class="wire-toggle" id="wire-toggle" aria-pressed="false">Pause</button></div></header><div class="stories-frame"><div id="wire-view" class="wire-view-panel"><div id="news-track" class="wire-news-content"><p class="wire-status">Loading headlines…</p></div></div><div id="tv-view" class="tv-view-panel" style="display:none;"></div></div></aside>
<main id="main-stack"><section id="ticker-deck"><div class="tape-row"><div class="tape-label">Indices<small>and equities</small></div><div class="tape-slot" id="tape-global"></div></div><div class="tape-row"><div class="tape-label">Equities<small>continued</small></div><div class="tape-slot" id="tape-europe"></div></div><div class="tape-row"><div class="tape-label">FX majors<small>and macro</small></div><div class="tape-slot" id="tape-macro"></div></div></section><header id="control-bar"><div class="desk-brand"><h1 class="desk-title">Zico — Macau FX &amp; Global Index Desk</h1><span class="desk-sub">Live indices, FX majors, MOP spot and hub weather</span></div><ul class="session-board" id="session-board"></ul></header><div id="open-stage"></div><section class="ticker-band band-clock"><div class="band-label">Clocks</div><div class="marquee-viewport"><div class="marquee-track" id="clock-track"><div class="marquee-group" data-group="a"></div><div class="marquee-group" data-group="b" aria-hidden="true"></div></div></div></section><section class="ticker-band band-fx"><div class="band-label">MOP Spot<small>TradingView FX</small></div><div class="fx-widget-slot" id="tape-mop-fx"></div></section><section class="ticker-band band-weather"><div class="band-label">Weather</div><div class="marquee-viewport"><div class="marquee-track" id="wx-track"><div class="marquee-group" data-group="a"></div><div class="marquee-group" data-group="b" aria-hidden="true"></div></div></div></section></main></div>
<script>
(()=>{'use strict';
const MARKETS=[{code:'USD',city:'New York',zone:'America/New_York',sessions:[[570,960]]},{code:'EUR',city:'Frankfurt',zone:'Europe/Berlin',sessions:[[540,1050]]},{code:'GBP',city:'London',zone:'Europe/London',sessions:[[480,990]]},{code:'CHF',city:'Zurich',zone:'Europe/Zurich',sessions:[[540,1050]]},{code:'HKD',city:'Hong Kong',zone:'Asia/Hong_Kong',sessions:[[570,720],[780,960]]},{code:'JPY',city:'Tokyo',zone:'Asia/Tokyo',sessions:[[540,690],[750,930]]}];const HUBS=[{id:'ny',icon:'🗽',city:'New York',zone:'America/New_York',lat:40.7128,lon:-74.006},{id:'fra',icon:'🏛️',city:'Frankfurt',zone:'Europe/Berlin',lat:50.1109,lon:8.6821},{id:'lon',icon:'🎡',city:'London',zone:'Europe/London',lat:51.5074,lon:-.1278},{id:'zrh',icon:'🏔️',city:'Zurich',zone:'Europe/Zurich',lat:47.3769,lon:8.5417},{id:'hkg',icon:'🏙️',city:'Hong Kong',zone:'Asia/Hong_Kong',lat:22.3193,lon:114.1694},{id:'mac',icon:'🎰',city:'Macau',zone:'Asia/Macau',lat:22.1987,lon:113.5439},{id:'tok',icon:'🗼',city:'Tokyo',zone:'Asia/Tokyo',lat:35.6762,lon:139.6503},{id:'syd',icon:'🦘',city:'Sydney',zone:'Australia/Sydney',lat:-33.8688,lon:151.2093}];const WIRE_FEEDS=[{source:'Reuters',url:'https://www.reuters.com/world/'},{source:'CNBC',url:'https://www.cnbc.com/id/100003114/device/rss/rss.html'},{source:'MarketWatch',url:'https://feeds.marketwatch.com/marketwatch/topstories/'},{source:'Yahoo Finance',url:'https://finance.yahoo.com/news/rssindex'}],RSS_PROXY='https://api.rss2json.com/v1/api.json?rss_url=',STORE={wx:'zico_weather_v1',wire:'zico_market_wire_v1'};let active='wire',tvMounted=false,signature='';const read=k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}},write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};async function json(url,ms=9000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw Error();return await r.json()}finally{clearTimeout(t)}}function mountTape(id,symbols){const slot=document.getElementById(id),c=document.createElement('div'),w=document.createElement('div'),s=document.createElement('script');c.className='tradingview-widget-container';w.className='tradingview-widget-container__widget';s.async=true;s.src='https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js';s.textContent=JSON.stringify({symbols,showSymbolLogo:true,isTransparent:true,displayMode:'regular',colorTheme:'dark',locale:'en'});c.append(w,s);slot.replaceChildren(c)}function mountTickerDeck(){const a=window.ZICO_SECURITIES||[],n=Math.ceil(a.length/2);mountTape('tape-global',a.slice(0,n));mountTape('tape-europe',a.slice(n));mountTape('tape-macro',window.ZICO_FX||[]);mountTape('tape-mop-fx',[{proName:'FX_IDC:USDMOP',title:'USD/MOP'},{proName:'FX_IDC:EURMOP',title:'EUR/MOP'},{proName:'FX_IDC:GBPMOP',title:'GBP/MOP'},{proName:'FX_IDC:CHFMOP',title:'CHF/MOP'},{proName:'FX_IDC:HKDMOP',title:'HKD/MOP'},{proName:'FX_IDC:JPYMOP',title:'JPY/MOP'}])}function safe(u){try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:null}catch{return null}}function age(t){const m=Math.max(0,Math.round((Date.now()-t)/60000));return m<1?'Just now':m<60?m+'m ago':Math.round(m/60)+'h ago'}async function fetchStories(){const r=await Promise.allSettled(WIRE_FEEDS.map(async f=>{const j=await json(RSS_PROXY+encodeURIComponent(f.url));if(j.status!=='ok'||!Array.isArray(j.items))throw Error();return j.items.map(x=>({source:f.source,title:String(x.title||'').replace(/<[^>]*>/g,'').trim(),link:safe(x.link),ts:Date.parse(x.pubDate)}))}));const seen=new Set(),a=[];for(const q of r)if(q.status==='fulfilled')for(const x of q.value){const k=x.title.toLowerCase();if(x.title&&x.link&&!seen.has(k)){seen.add(k);a.push(x)}}return a.sort((x,y)=>(y.ts||0)-(x.ts||0)).slice(0,24)}function newsList(a,clone){const ul=document.createElement('ul');ul.className='wire-list';if(clone)ul.setAttribute('aria-hidden','true');for(const x of a){const li=document.createElement('li'),a=document.createElement('a'),meta=document.createElement('span'),src=document.createElement('span'),time=document.createElement('time'),title=document.createElement('span');li.className='wire-item';a.className='wire-link';a.href=x.link;a.target='_blank';a.rel='noopener noreferrer';if(clone)a.tabIndex=-1;meta.className='wire-meta';src.className='wire-source';src.textContent=x.source;time.textContent=Number.isFinite(x.ts)?age(x.ts):'';time.dataset.ts=Number.isFinite(x.ts)?x.ts:'';meta.append(src,time);title.className='wire-headline';title.textContent=x.title;a.append(meta,title);li.append(a);ul.append(li)}return ul}function render(a){const sig=a.map(x=>x.link).join('|');if(sig===signature)return;signature=sig;const track=document.createElement('div'),listA=newsList(a,false),listB=newsList(a,true);track.className='wire-track';track.id='news-track';track.append(listA,listB);const container=document.getElementById('wire-view');container.replaceChildren(track);requestAnimationFrame(()=>track.style.setProperty('--wire-duration',Math.max(45,Math.round(listA.offsetHeight/24))+'s'))}function cached(){const x=read(STORE.wire);if(x?.stories?.length)render(x.stories)}async function refresh(){try{const a=await fetchStories();if(a.length>=3){write(STORE.wire,{stories:a,savedAt:Date.now()});render(a);return}}catch{}cached();if(!signature)document.getElementById('wire-view').innerHTML='<p class="wire-status">Headlines temporarily unavailable.</p>'}function mountTV(){if(tvMounted)return;tvMounted=true;const v=document.createElement('div'),outer=document.createElement('div'),c=document.createElement('div'),w=document.createElement('div'),s=document.createElement('script');v.className='tv-viewport';outer.className='tv-marquee';c.className='tradingview-widget-container';w.className='tradingview-widget-container__widget';s.async=true;s.src='https://s3.tradingview.com/external-embedding/embed-widget-timeline.js';s.textContent=JSON.stringify({feedMode:'all_symbols',displayMode:'regular',isTransparent:true,colorTheme:'dark',locale:'en',width:'100%',height:'100%'});c.append(w,s);outer.append(c);v.append(outer);document.getElementById('tv-view').append(v)}function switchView(v){active=v;const wire=document.getElementById('wire-view'),tv=document.getElementById('tv-view'),bw=document.getElementById('tab-wire'),bt=document.getElementById('tab-tv'),isWire=v==='wire';wire.style.display=isWire?'block':'none';tv.style.display=isWire?'none':'block';bw.classList.toggle('active',isWire);bt.classList.toggle('active',!isWire);bw.setAttribute('aria-selected',String(isWire));bt.setAttribute('aria-selected',String(!isWire));try{localStorage.setItem('zico_news_view',v)}catch{}if(isWire){if(!document.querySelector('#wire-view .wire-track'))cached();if(!document.querySelector('#wire-view .wire-track'))refresh()}else mountTV()}document.getElementById('tab-wire').onclick=()=>switchView('wire');document.getElementById('tab-tv').onclick=()=>switchView('tv');document.getElementById('wire-toggle').onclick=e=>{const p=!document.getElementById('stories-sidebar').classList.contains('is-paused');document.getElementById('stories-sidebar').classList.toggle('is-paused',p);e.currentTarget.textContent=p?'Play':'Pause';e.currentTarget.setAttribute('aria-pressed',String(p))};let saved='wire';try{saved=localStorage.getItem('zico_news_view')||'wire'}catch{}switchView(saved==='tv'?'tv':'wire');setInterval(()=>{if(active==='wire')refresh()},300000);setInterval(()=>document.querySelectorAll('.wire-meta time[data-ts]').forEach(x=>{if(x.dataset.ts)x.textContent=age(+x.dataset.ts)}),60000);
function clockMarkup(){for(const g of document.querySelectorAll('#clock-track [data-group]'))for(const h of HUBS){const i=document.createElement('span'),c=document.createElement('span'),t=document.createElement('span');i.className='clock-item';c.className='clock-city';c.textContent=h.icon+' '+h.city;t.className='clock-time tabular';t.dataset.clockId=h.id;i.append(c,t);g.append(i)}}function sessions(){const board=document.getElementById('session-board');board.replaceChildren();const now=new Date();for(const m of MARKETS){const p=new Intl.DateTimeFormat('en-GB',{timeZone:m.zone,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(now),hm=+p.find(x=>x.type==='hour').value*60 + +p.find(x=>x.type==='minute').value,open=m.sessions.some(([a,b])=>hm>=a&&hm<b),li=document.createElement('li');li.className='session-pill '+(open?'is-open':'is-closed');li.textContent=m.city+' '+(open?'OPEN':'CLOSED');board.append(li)}}function clocks(){const n=new Date();for(const h of HUBS){const s=n.toLocaleTimeString('en-US',{timeZone:h.zone,hour:'2-digit',minute:'2-digit',second:'2-digit'});document.querySelectorAll('[data-clock-id="'+h.id+'"]').forEach(x=>x.textContent=s)}sessions()}function wxcode(n){if(n===0)return['☀️','Clear'];if(n<3)return['⛅','Cloudy'];if(n===3)return['☁️','Overcast'];if(n<50)return['🌫️','Fog'];if(n<70)return['🌧️','Rain'];if(n<80)return['❄️','Snow'];if(n<90)return['🌦️','Showers'];return['⚡','Thunderstorm']}function weather(entries){for(const g of document.querySelectorAll('#wx-track [data-group]')){g.replaceChildren();for(const e of entries){const i=document.createElement('span');i.className='wx-item';i.textContent=e.icon+' '+e.city+' '+e.temp+'°C '+e.condition;g.append(i)}}}async function refreshWeather(){try{const lat=HUBS.map(x=>x.lat).join(','),lon=HUBS.map(x=>x.lon).join(','),d=await json('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,weather_code&timezone=auto',10000),arr=Array.isArray(d)?d:[d];const a=HUBS.map((h,i)=>{const c=arr[i].current,[icon,condition]=wxcode(+c.weather_code);return{city:h.city,icon,condition,temp:+c.temperature_2m}});write(STORE.wx,{entries:a});weather(a)}catch{const x=read(STORE.wx);if(x?.entries)weather(x.entries)}}mountTickerDeck();clockMarkup();clocks();setInterval(clocks,1000);const old=read(STORE.wx);if(old?.entries)weather(old.entries);refreshWeather();setInterval(refreshWeather,600000)
})();
</script>
</body>
