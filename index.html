<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zico — Global Markets TV Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg-abyss: #060B12;
    --bg-panel: #0B1320;
    --bg-header: #09111D;
    --bg-clock: #081629;
    --bg-fx: #061813;
    --bg-weather: #091C32;
    --rule: #1C2B40;
    --rule-fx: #14533D;
    --text-primary: #F1F5F9;
    --text-secondary: #94A3B8;
    --up-jade: #12B886;
    --down-coral: #F05252;
    --amber-live: #F59F00;
    --font-ui: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: var(--bg-abyss);
    color: var(--text-primary);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
}

.tabular {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
}

/* =========================================
   APP GRID (20vw SIDEBAR | 80vw STAGE)
   ========================================= */

#dashboard {
    display: grid;
    grid-template-columns: 20vw 80vw;
    width: 100vw;
    height: 100vh;
    background: var(--rule);
    gap: 1px;
}

/* =========================================
   LEFT SIDEBAR: MARKET WIRE
   ========================================= */

#stories-sidebar {
    display: grid;
    grid-template-rows: 72px 1fr;
    background: var(--bg-panel);
    min-width: 0;
    min-height: 0;
    overflow: hidden;
}

.sidebar-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    background: var(--bg-header);
    border-bottom: 1px solid var(--rule);
}

.sidebar-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--text-primary);
}

.live-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--up-jade);
}

.live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--up-jade);
    box-shadow: 0 0 8px rgba(18, 184, 134, 0.7);
    animation: livePulse 2.2s ease-in-out infinite;
}

.sidebar-heading {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
}

.sidebar-sub {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
}

.sidebar-tools {
    display: flex;
    align-items: center;
    gap: 10px;
}

.wire-toggle {
    border: 1px solid var(--rule);
    background: var(--bg-abyss);
    color: var(--text-secondary);
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    cursor: pointer;
    transition: color 140ms ease, border-color 140ms ease;
}

.wire-toggle:hover {
    color: var(--text-primary);
    border-color: var(--text-secondary);
}

.wire-toggle:focus-visible {
    outline: 2px solid var(--up-jade);
    outline-offset: 1px;
}

.stories-frame {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 0;
    overflow: hidden;
    background: var(--bg-panel);
}

.stories-frame::before,
.stories-frame::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    height: 40px;
    z-index: 2;
    pointer-events: none;
}

.stories-frame::before {
    top: 0;
    background: linear-gradient(to bottom, var(--bg-panel), rgba(11, 19, 32, 0));
}

.stories-frame::after {
    bottom: 0;
    background: linear-gradient(to top, var(--bg-panel), rgba(11, 19, 32, 0));
}

.wire-viewport {
    height: 100%;
    overflow: hidden;
}

.wire-track {
    will-change: transform;
    animation: wireScroll var(--wire-duration, 120s) linear infinite;
}

.wire-viewport:hover .wire-track,
.wire-viewport:focus-within .wire-track,
#stories-sidebar.is-paused .wire-track,
#stories-sidebar.is-paused .wire-fallback {
    animation-play-state: paused;
}

/* Keyboard browsing: stop the loop and use native scroll so the focused headline is always visible */
.stories-frame.is-browsing .wire-track {
    animation: none;
}

.stories-frame.is-browsing .wire-viewport {
    overflow-y: auto;
}

.stories-frame.is-browsing .wire-list[aria-hidden="true"] {
    display: none;
}

.wire-list {
    list-style: none;
}

.wire-item {
    border-bottom: 1px solid var(--rule);
}

.wire-link {
    display: block;
    padding: 14px 16px 16px;
    color: inherit;
    text-decoration: none;
}

.wire-link:hover .wire-headline {
    color: #FFFFFF;
    text-decoration: underline;
    text-decoration-color: rgba(148, 163, 184, 0.55);
    text-underline-offset: 3px;
}

.wire-link:focus-visible {
    outline: 2px solid var(--up-jade);
    outline-offset: -2px;
}

.wire-meta {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
}

.wire-source {
    color: #93C5FD;
}

.wire-headline {
    display: block;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
    color: var(--text-primary);
}

.wire-status {
    padding: 18px 16px;
    font-size: 13px;
    color: var(--text-secondary);
}

.wire-fallback {
    height: 200%;
    animation: wireFallback 90s ease-in-out infinite alternate;
}

.wire-fallback .tradingview-widget-container,
.wire-fallback .tradingview-widget-container__widget {
    width: 100%;
    height: 100%;
}

/* =========================================
   RIGHT BROADCAST STACK (80vw x 100vh)
   ========================================= */

#main-stack {
    display: grid;
    grid-template-rows: auto 52px minmax(0, 1fr) 8.2vh 9.0vh 8.2vh;
    min-width: 0;
    min-height: 0;
    background: var(--rule);
    gap: 1px;
}

/* =========================================
   ROW 1: ENLARGED TWO-DECK MARKETS TICKER
   ========================================= */

#ticker-deck {
    display: grid;
    grid-template-rows: repeat(2, 76px);
    gap: 1px;
    background: var(--rule);
    min-width: 0;
}

.tape-row {
    display: grid;
    grid-template-columns: 118px minmax(0, 1fr);
    background: var(--bg-header);
    min-width: 0;
    overflow: hidden;
}

.tape-label {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 14px;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--text-primary);
    border-right: 1px solid var(--rule);
    background: rgba(6, 11, 18, 0.45);
}

.tape-label small {
    margin-top: 3px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
}

.tape-slot {
    display: flex;
    align-items: center;
    min-width: 0;
    overflow: hidden;
}

.tape-slot .tradingview-widget-container {
    width: 100%;
}

.tape-slot.is-static {
    overflow-x: auto;
}

.tape-slot.is-static .tradingview-widget-container {
    flex-shrink: 0;
    min-width: var(--static-strip-width, 100%);
}

/* =========================================
   ROW 2: DESK BAR & CASH SESSION BOARD
   ========================================= */

#control-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 0 16px;
    background: var(--bg-header);
    min-width: 0;
}

.desk-brand {
    display: flex;
    align-items: baseline;
    gap: 12px;
    min-width: 0;
}

.desk-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.desk-sub {
    font-size: 13px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.session-board {
    display: flex;
    flex-shrink: 0;
    align-items: center;
    gap: 6px;
    list-style: none;
}

.session-pill {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    padding: 3px 8px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid transparent;
    white-space: nowrap;
}

.session-city {
    color: var(--text-primary);
}

.session-pill.is-open {
    color: var(--up-jade);
    background: rgba(18, 184, 134, 0.12);
    border-color: rgba(18, 184, 134, 0.35);
}

.session-pill.is-break {
    color: var(--amber-live);
    background: rgba(245, 159, 0, 0.12);
    border-color: rgba(245, 159, 0, 0.35);
}

.session-pill.is-closed {
    color: var(--text-secondary);
    background: rgba(148, 163, 184, 0.08);
    border-color: var(--rule);
}

/* =========================================
   ROW 3: OPEN STAGE (INTENTIONAL NEGATIVE SPACE)
   ========================================= */

#open-stage {
    background: var(--bg-abyss);
    min-width: 0;
    min-height: 0;
}

/* =========================================
   ROWS 4-6: SEAMLESS DUAL-TRACK MARQUEE BANDS
   ========================================= */

.ticker-band {
    display: grid;
    grid-template-columns: 118px 1fr;
    align-items: stretch;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
}

.band-clock {
    background: var(--bg-clock);
}

.band-fx {
    background: var(--bg-fx);
    border-top: 1px solid var(--rule-fx);
    border-bottom: 1px solid var(--rule-fx);
}

.band-weather {
    background: var(--bg-weather);
}

.band-label {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 12px;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
    border-right: 1px solid var(--rule);
    background: rgba(6, 11, 18, 0.45);
    white-space: nowrap;
}

.band-fx .band-label {
    color: var(--up-jade);
    border-right-color: var(--rule-fx);
}

.marquee-viewport {
    position: relative;
    display: flex;
    align-items: center;
    overflow: hidden;
    min-width: 0;
}

.marquee-track {
    display: flex;
    align-items: center;
    width: max-content;
    will-change: transform;
}

.band-clock .marquee-track {
    animation: marqueeScroll 42s linear infinite;
}

.band-fx .marquee-track {
    animation: marqueeScroll 36s linear infinite;
}

.band-weather .marquee-track {
    animation: marqueeScroll 54s linear infinite;
}

.ticker-band:hover .marquee-track {
    animation-play-state: paused;
}

.marquee-group {
    display: flex;
    align-items: center;
    flex-shrink: 0;
}

/* Clock Items */

.clock-item {
    display: inline-flex;
    align-items: baseline;
    gap: 10px;
    padding: 0 28px;
    border-right: 1px solid rgba(255, 255, 255, 0.08);
    white-space: nowrap;
}

.clock-city {
    font-size: 19px;
    font-weight: 700;
    color: var(--text-primary);
}

.clock-time {
    font-size: 22px;
    font-weight: 700;
    color: #93C5FD;
}

/* MOP FX Items */

.fx-item {
    display: inline-flex;
    align-items: baseline;
    gap: 10px;
    padding: 0 28px;
    border-right: 1px solid rgba(18, 184, 134, 0.22);
    white-space: nowrap;
}

.fx-unit {
    font-size: 17px;
    font-weight: 600;
    color: var(--up-jade);
}

.fx-value {
    font-size: 21px;
    font-weight: 700;
    color: var(--text-primary);
}

.fx-delta {
    font-size: 14px;
    font-weight: 600;
}

.fx-delta.is-up {
    color: var(--up-jade);
}

.fx-delta.is-down {
    color: var(--down-coral);
}

.fx-delta.is-flat {
    color: var(--text-secondary);
}

/* Weather Items */

.wx-item {
    display: inline-flex;
    align-items: baseline;
    gap: 10px;
    padding: 0 28px;
    border-right: 1px solid rgba(255, 255, 255, 0.08);
    white-space: nowrap;
}

.wx-city {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-primary);
}

.wx-temp {
    font-size: 21px;
    font-weight: 700;
    color: #BAE6FD;
}

.wx-cond {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
}

.wx-meta {
    font-size: 13px;
    color: var(--text-secondary);
}

/* =========================================
   ANIMATIONS & ACCESSIBILITY
   ========================================= */

@keyframes marqueeScroll {
    0% {
        transform: translate3d(0, 0, 0);
    }
    100% {
        transform: translate3d(-50%, 0, 0);
    }
}

@keyframes livePulse {
    0%, 100% {
        opacity: 1;
    }
    50% {
        opacity: 0.45;
    }
}

@keyframes wireScroll {
    0% {
        transform: translate3d(0, 0, 0);
    }
    100% {
        transform: translate3d(0, -50%, 0);
    }
}

@keyframes wireFallback {
    0% {
        transform: translate3d(0, 0, 0);
    }
    100% {
        transform: translate3d(0, -50%, 0);
    }
}

@media (prefers-reduced-motion: reduce) {
    .marquee-track,
    .wire-track,
    .wire-fallback {
        animation: none !important;
    }
    .marquee-viewport {
        overflow-x: auto;
    }
    .wire-viewport {
        overflow-y: auto;
    }
    .wire-fallback {
        height: 100%;
    }
    .marquee-group[aria-hidden="true"],
    .wire-list[aria-hidden="true"] {
        display: none;
    }
    .live-dot {
        animation: none;
    }
}

/* Mid-width desks: drop the subtitle so the title never runs into the session board */
@media (max-width: 1600px) and (min-width: 1025px) {
    .desk-sub {
        display: none;
    }
}

/* Short broadcast screens (e.g. 1366x768): keep the ticker deck compact */
@media (max-height: 860px) and (min-width: 1025px) {
    #ticker-deck {
        grid-template-rows: repeat(2, 66px);
    }
}

/* Responsive fallback for smaller viewports */
@media (max-width: 1024px) {
    html,
    body {
        height: auto;
        overflow-x: hidden;
        overflow-y: auto;
    }

    #dashboard {
        grid-template-columns: 1fr;
        height: auto;
    }

    #stories-sidebar {
        order: 2;
        height: 480px;
    }

    #main-stack {
        order: 1;
        grid-template-rows: auto auto 58px 62px 58px;
    }

    #control-bar {
        flex-wrap: wrap;
        gap: 8px;
        padding: 10px 12px;
    }

    .session-board {
        flex-wrap: wrap;
    }

    #open-stage {
        display: none;
    }

    .ticker-band,
    .tape-row {
        grid-template-columns: 92px minmax(0, 1fr);
    }

    .tape-label {
        font-size: 13px;
        padding: 0 10px;
    }
}

@media (max-width: 640px) {
    .desk-title {
        white-space: normal;
    }

    .desk-sub {
        display: none;
    }
}
</style>

</head>

    async function fetchJsonWithTimeout(url, timeoutMs = 8000) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
            const response = await fetch(url, { signal: controller.signal, cache: 'no-store' });
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            return await response.json();
        } finally {
            clearTimeout(timer);
        }
    }

    function getSessionState(market, now = new Date()) {
        const parts = new Intl.DateTimeFormat('en-US', {
            timeZone: market.zone,
            weekday: 'short',
            hour: '2-digit',
            minute: '2-digit',
            hourCycle: 'h23'
        }).formatToParts(now);

        const weekday = parts.find((p) => p.type === 'weekday')?.value;
        if (weekday === 'Sat' || weekday === 'Sun') {
            return { label: 'Closed', cls: 'is-closed' };
        }

        const hour = Number(parts.find((p) => p.type === 'hour')?.value || 0);
        const minute = Number(parts.find((p) => p.type === 'minute')?.value || 0);
        const mins = hour * 60 + minute;

        const inSession = market.sessions.some(([start, end]) => mins >= start && mins < end);
        if (inSession) {
            return { label: 'Open', cls: 'is-open' };
        }

        if (market.sessions.length > 1) {
            const firstStart = market.sessions[0][0];
            const lastEnd = market.sessions[market.sessions.length - 1][1];
            if (mins >= firstStart && mins < lastEnd) {
                return { label: 'Break', cls: 'is-break' };
            }
        }

        return { label: 'Closed', cls: 'is-closed' };
    }

    const RSS_PROXY = 'https://api.rss2json.com/v1/api.json?rss_url=';

    let wireSignature = '';

    function parseFeedDate(raw) {
        if (!raw) return NaN;
        // rss2json returns UTC timestamps as "YYYY-MM-DD HH:MM:SS"
        const iso = /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(raw) ? `${raw.replace(' ', 'T')}Z` : raw;
        return Date.parse(iso);
    }

    function decodeEntities(text) {
        const area = document.createElement('textarea');
        area.innerHTML = text;
        return area.value;
    }

    function safeHttpUrl(raw) {
        try {
            const url = new URL(raw);
            return url.protocol === 'https:' || url.protocol === 'http:' ? url.href : null;
        } catch {
            return null;
        }
    }

    function formatAge(ts) {
        if (!Number.isFinite(ts)) return '';
        const mins = Math.max(0, Math.round((Date.now() - ts) / 60000));
        if (mins < 1) return 'Just now';
        if (mins < 60) return `${mins}m ago`;
        const hours = Math.round(mins / 60);
        if (hours < 24) return `${hours}h ago`;
        return `${Math.round(hours / 24)}d ago`;
    }

    async function fetchWireStories() {
        const results = await Promise.allSettled(WIRE_FEEDS.map(async (feed, idx) => {
            // Stagger requests so the keyless proxy doesn't rate-limit (HTTP 429) a burst
            await new Promise((resolve) => setTimeout(resolve, idx * WIRE_FEED_STAGGER_MS));
            const json = await fetchJsonWithTimeout(`${RSS_PROXY}${encodeURIComponent(feed.url)}`, 9000);
            if (json?.status !== 'ok' || !Array.isArray(json.items)) {
                throw new Error(`Feed unavailable: ${feed.source}`);
            }
            return json.items.map((item) => ({
                title: decodeEntities(String(item.title || '')).replace(/\s+/g, ' ').trim(),
                link: safeHttpUrl(item.link),
                source: feed.source,
                ts: parseFeedDate(item.pubDate)
            }));
        }));

        const seen = new Set();
        const stories = [];
        results.forEach((result) => {
            if (result.status !== 'fulfilled') return;
            result.value.forEach((story) => {
                const key = story.title.toLowerCase();
                if (!story.title || !story.link || seen.has(key)) return;
                seen.add(key);
                stories.push(story);
            });
        });

        stories.sort((a, b) => (b.ts || 0) - (a.ts || 0));
        return stories.slice(0, WIRE_MAX_ITEMS);
    }

    function buildWireList(stories, isClone) {
        const list = document.createElement('ul');
        list.className = 'wire-list';
        if (isClone) {
            list.setAttribute('aria-hidden', 'true');
        } else {
            list.setAttribute('aria-label', 'Latest market headlines');
        }

        stories.forEach((story) => {
            const item = document.createElement('li');
            item.className = 'wire-item';

            const link = document.createElement('a');
            link.className = 'wire-link';
            link.href = story.link;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            if (isClone) link.tabIndex = -1;

            const meta = document.createElement('span');
            meta.className = 'wire-meta';

            const source = document.createElement('span');
            source.className = 'wire-source';
            source.textContent = story.source;

            const time = document.createElement('time');
            time.className = 'wire-time tabular';
            if (Number.isFinite(story.ts)) {
                time.dateTime = new Date(story.ts).toISOString();
                time.dataset.ts = String(story.ts);
                time.textContent = formatAge(story.ts);
            }

            meta.append(source, time);

            const headline = document.createElement('span');
            headline.className = 'wire-headline';
            headline.textContent = story.title;

            link.append(meta, headline);
            item.appendChild(link);
            list.appendChild(item);
        });

        return list;
    }

    function renderWire(stories) {
        const signature = stories.map((s) => s.link).join('|');
        if (signature === wireSignature) return;

        const frame = document.getElementById('wire-frame');
        // Don't yank the list out from under someone reading or tabbing through it
        if (wireSignature && frame.matches(':hover, :focus-within')) return;
        wireSignature = signature;

        const viewport = document.createElement('div');
        viewport.className = 'wire-viewport';

        const track = document.createElement('div');
        track.className = 'wire-track';
        track.append(buildWireList(stories, false), buildWireList(stories, true));
        viewport.appendChild(track);

        frame.textContent = '';
        frame.appendChild(viewport);

        requestAnimationFrame(() => {
            const loopHeight = track.firstElementChild.offsetHeight;
            const seconds = Math.max(45, Math.round(loopHeight / WIRE_SCROLL_PX_PER_SEC));
            track.style.setProperty('--wire-duration', `${seconds}s`);
        });
    }

    function convertHkdRatesToMop(rawRates, lowercaseKeys = false) {
        if (!rawRates) return null;
        const computed = {};
        for (const market of MARKETS) {
            if (market.code === 'HKD') {
                computed.HKD = HKD_TO_MOP_PEG;
                continue;
            }
            const key = lowercaseKeys ? market.code.toLowerCase() : market.code;
            const perHkd = Number(rawRates[key]);
            if (!Number.isFinite(perHkd) || perHkd <= 0) {
                return null;
            }
            computed[market.code] = (market.unit / perHkd) * HKD_TO_MOP_PEG;
        }
        return computed;
    }

    async function fetchPreviousCloseMopRates() {
        const todayUtc = new Date().toISOString().slice(0, 10);
        const cached = readStorage(FX_PREV_STORAGE_KEY);
        if (cached?.forToday === todayUtc && cached?.rates) {
            return cached.rates;
        }

        // Primary historical benchmark: previous UTC trading snapshot in HKD base
        try {
            const latest = await fetchJsonWithTimeout(
                'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/hkd.min.json'
            );
            let prevRaw = latest?.date && latest.date < todayUtc ? latest.hkd : null;

            if (!prevRaw) {
                for (let backDays = 1; backDays <= 3; backDays++) {
                    const dt = new Date(Date.now() - backDays * 86400000).toISOString().slice(0, 10);
                    try {
                        const snap = await fetchJsonWithTimeout(
                            `https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${dt}/v1/currencies/hkd.min.json`
                        );
                        if (snap?.date && snap.date < todayUtc && snap.hkd) {
                            prevRaw = snap.hkd;
                            break;
                        }
                    } catch {
                        // Try previous date
                    }
                }
            }

            const converted = convertHkdRatesToMop(prevRaw, true);
            if (converted) {
                writeStorage(FX_PREV_STORAGE_KEY, { forToday: todayUtc, rates: converted });
                return converted;
            }
        } catch {
            // Fall through to Frankfurter ECB reference series
        }

        try {
            const startDate = new Date(Date.now() - 5 * 86400000).toISOString().slice(0, 10);
            const frank = await fetchJsonWithTimeout(
                `https://api.frankfurter.dev/v1/${startDate}..?base=HKD&symbols=USD,EUR,GBP,CHF,JPY`
            );
            const dates = Object.keys(frank?.rates || {})
                .filter((d) => d < todayUtc)
                .sort();
            const prevDate = dates[dates.length - 1];
            const converted = convertHkdRatesToMop(prevDate ? frank.rates[prevDate] : null, false);
            if (converted) {
                writeStorage(FX_PREV_STORAGE_KEY, { forToday: todayUtc, rates: converted });
                return converted;
            }
        } catch {
            // Historical reference unavailable
        }

        return cached?.rates || null;
    }

    function renderMopRates(mopRates, prevCloseRates) {
        const track = document.getElementById('fx-track');
        const groupA = track.querySelector('[data-group="a"]');
        const groupB = track.querySelector('[data-group="b"]');

        const buildGroup = () => {
            const frag = document.createDocumentFragment();
            MARKETS.forEach((market) => {
                const rate = mopRates[market.code];
                const prev = prevCloseRates ? prevCloseRates[market.code] : null;

                const item = document.createElement('span');
                item.className = 'fx-item';

                const unit = document.createElement('span');
                unit.className = 'fx-unit';
                unit.textContent = `${market.flag} ${market.unit} ${market.code} = `;

                const val = document.createElement('span');
                val.className = 'fx-value tabular';
                val.textContent = `${rate.toFixed(4)} MOP`;

                item.append(unit, val);

                if (Number.isFinite(prev) && prev > 0) {
                    const diff = rate - prev;
                    const pct = (diff / prev) * 100;
                    const delta = document.createElement('span');
                    delta.className = 'fx-delta tabular';

                    if (Math.abs(pct) < 0.005) {
                        delta.classList.add('is-flat');
                        delta.textContent = ' 0.00%';
                    } else if (diff > 0) {
                        delta.classList.add('is-up');
                        delta.textContent = ` ▲ +${diff.toFixed(4)} (+${pct.toFixed(2)}%)`;
                    } else {
                        delta.classList.add('is-down');
                        delta.textContent = ` ▼ ${diff.toFixed(4)} (${pct.toFixed(2)}%)`;
                    }
                    item.appendChild(delta);
                }

                frag.appendChild(item);
            });
            return frag;
        };

        groupA.textContent = '';
        groupB.textContent = '';
        groupA.appendChild(buildGroup());
        groupB.appendChild(buildGroup());
    }

    async function fetchLiveHkdBaseMopRates() {
        const providers = [
            {
                url: 'https://api.coinbase.com/v2/exchange-rates?currency=HKD',
                extract: (json) => convertHkdRatesToMop(json?.data?.rates, false)
            },
            {
                url: 'https://open.er-api.com/v6/latest/HKD',
                extract: (json) => convertHkdRatesToMop(json?.rates, false)
            },
            {
                url: 'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/hkd.min.json',
                extract: (json) => convertHkdRatesToMop(json?.hkd, true)
            }
        ];

        for (const provider of providers) {
            try {
                const json = await fetchJsonWithTimeout(provider.url);
                const computed = provider.extract(json);
                if (computed) {
                    writeStorage(FX_STORAGE_KEY, { rates: computed, savedAt: Date.now() });
                    return computed;
                }
            } catch {
                // Continue to next failover provider
            }
        }

        const cached = readStorage(FX_STORAGE_KEY);
        if (cached?.rates) {
            return cached.rates;
        }

        return Object.fromEntries(MARKETS.map((m) => [m.code, m.fallbackMop]));
    }

    async function fetchMopRates() {
        const [prevCloseRates, liveRates] = await Promise.all([
            fetchPreviousCloseMopRates(),
            fetchLiveHkdBaseMopRates()
        ]);
        renderMopRates(liveRates, prevCloseRates);
    }

    /* =========================================
       4. REAL-TIME MULTI-CITY WEATHER (OPEN-METEO)
       ========================================= */

    function decodeWmoWeather(code, isDay) {
        const day = isDay !== 0;
        if (code === 0) return { icon: day ? '☀️' : '🌙', label: 'Clear' };
        if (code === 1) return { icon: day ? '🌤️' : '🌙', label: 'Mainly clear' };
        if (code === 2) return { icon: day ? '⛅' : '☁️', label: 'Partly cloudy' };
        if (code === 3) return { icon: '☁️', label: 'Overcast' };
        if (code === 45 || code === 48) return { icon: '🌫️', label: 'Fog' };
        if (code >= 51 && code <= 57) return { icon: '🌦️', label: 'Drizzle' };
        if (code >= 61 && code <= 67) return { icon: '🌧️', label: 'Rain' };
        if (code >= 71 && code <= 77) return { icon: '❄️', label: 'Snow' };
        if (code >= 80 && code <= 82) return { icon: '🌦️', label: 'Showers' };
        if (code === 85 || code === 86) return { icon: '🌨️', label: 'Snow showers' };
        if (code >= 95) return { icon: '⛈️', label: 'Thunderstorm' };
        return { icon: '🌡️', label: 'Current' };
    }

    function renderWeather(entries) {
        const track = document.getElementById('wx-track');
        const groupA = track.querySelector('[data-group="a"]');
        const groupB = track.querySelector('[data-group="b"]');

        const buildGroup = () => {
            const frag = document.createDocumentFragment();
            entries.forEach((entry) => {
                const item = document.createElement('span');
                item.className = 'wx-item';

                const city = document.createElement('span');
                city.className = 'wx-city';
                city.textContent = `${entry.weatherIcon} ${entry.city}`;

                const temp = document.createElement('span');
                temp.className = 'wx-temp tabular';
                temp.textContent = `${entry.temp.toFixed(1)}°C`;

                const cond = document.createElement('span');
                cond.className = 'wx-cond';
                cond.textContent = entry.condition;

                const meta = document.createElement('span');
                meta.className = 'wx-meta tabular';
                meta.textContent = `Feels ${entry.feels.toFixed(0)}°C  |  Hum ${Math.round(entry.humidity)}%  |  Wind ${Math.round(entry.wind)} km/h`;

                item.append(city, temp, cond, meta);
                frag.appendChild(item);
            });
            return frag;
        };

        groupA.textContent = '';
        groupB.textContent = '';
        groupA.appendChild(buildGroup());
        groupB.appendChild(buildGroup());
    }

    async function fetchWeather() {
        const lats = HUBS.map((h) => h.lat).join(',');
        const lons = HUBS.map((h) => h.lon).join(',');
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=temperature_2m,apparent_temperature,weather_code,relative_humidity_2m,wind_speed_10m,is_day&timezone=auto`;

        try {
            const payload = await fetchJsonWithTimeout(url, 9000);
            const list = Array.isArray(payload) ? payload : [payload];
            if (list.length !== HUBS.length) {
                throw new Error('Unexpected city count in Open-Meteo response');
            }

            const entries = HUBS.map((hub, idx) => {
                const cur = list[idx]?.current;
                if (!cur) throw new Error(`Missing current block for ${hub.city}`);
                const decoded = decodeWmoWeather(Number(cur.weather_code), Number(cur.is_day));
                return {
                    city: hub.city,
                    weatherIcon: decoded.icon,
                    condition: decoded.label,
                    temp: Number(cur.temperature_2m),
                    feels: Number(cur.apparent_temperature),
                    humidity: Number(cur.relative_humidity_2m),
                    wind: Number(cur.wind_speed_10m)
                };
            });

            writeStorage(WX_STORAGE_KEY, { entries, savedAt: Date.now() });
            renderWeather(entries);
            return;
        } catch {
            const cached = readStorage(WX_STORAGE_KEY);
            if (cached?.entries?.length) {
                renderWeather(cached.entries);
                return;
            }
        }
    }

    /* =========================================
       BOOTSTRAP
       ========================================= */

    mountTickerDeck();
    reducedMotionQuery.addEventListener('change', () => {
        mountTickerDeck();
        applyMotionPreference();
    });
    buildSessionBoard();
    setupWireToggle();
    setupWireKeyboardBrowsing();
    initWire();
    initClockMarkup();
    updateClocks();
    setInterval(updateClocks, 1000);

    fetchMopRates();
    setInterval(fetchMopRates, FX_POLL_MS);

    fetchWeather();
    setInterval(fetchWeather, WX_POLL_MS);
})();
</script>
